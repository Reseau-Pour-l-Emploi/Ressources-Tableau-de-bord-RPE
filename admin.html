<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration - Glossaire du tableau de bord RPE</title>
<link rel="icon" type="image/svg+xml" href="assets/tdb-rpe-icon.svg">
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script defer src="firebase-config.js"></script>
<style>
/* ==== En-tete/pied de page : identiques a index.html, ne pas modifier ==== */
@font-face{font-family:'Marianne';src:url('fonts/Marianne-Light.woff2') format('woff2');font-weight:300;font-display:swap}
@font-face{font-family:'Marianne';src:url('fonts/Marianne-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Marianne';src:url('fonts/Marianne-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Marianne';src:url('fonts/Marianne-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
:root{
  --ft-navy:#0D1440; --ft-indigo:#293378; --ft-indigo-light:#E3E5F1;
  --ft-jaune-light:#FFF4D6; --ft-jaune-dark:#E0A800;
  --ft-orange:#D96B00; --ft-orange-light:#FCEADB;
  --ft-bordeaux:#5C0F38; --ft-bordeaux-light:#EFDCE6;
  --ft-bleu-light:#E2E8FB; --ft-violet:#7E58A0; --ft-violet-light:#ECE6F2;
  --ft-rouge:#D92424;
  --ft-gray-200:#E5E7EB; --ft-gray-300:#D1D5DB; --ft-gray-500:#6B7280; --ft-gray-700:#374151;
  --ft-sable:#F5F2EE; --ft-border:var(--ft-gray-200);
  --ft-font:'Marianne',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  --sh-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh-md:0 4px 10px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--ft-font);font-size:14px;line-height:1.5;color:var(--ft-navy);background:var(--ft-sable)}
header.site{background:#fff;border-bottom:1px solid var(--ft-border);position:sticky;top:0;z-index:1100}
.site-inner{max-width:1200px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.site-inner img{height:42px}
.site-title{flex:1}
.site-title h1{font-size:18px;font-weight:700;margin:0;line-height:1.25}
.site-title .sub{font-size:12px;color:var(--ft-gray-500)}
.admin-link{font-size:12px;font-weight:600;color:var(--ft-indigo);text-decoration:none;border:1px solid var(--ft-indigo);border-radius:4px;padding:6px 12px;white-space:nowrap}
.admin-link:hover{background:var(--ft-indigo-light)}
main{max-width:1200px;margin:0 auto;padding:20px 24px 56px}
footer.site{border-top:1px solid var(--ft-border);background:#fff;margin-top:24px}
footer.site .inner{max-width:1200px;margin:0 auto;padding:16px 24px;font-size:12px;color:var(--ft-gray-500);display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:center}
.footer-icon{height:28px;width:auto;flex:none}
.footer-title{font-weight:700;color:var(--ft-navy);font-size:13px;white-space:nowrap}
.footer-ft-logo{height:34px;width:auto;flex:none}
/* ==== Corps ==== */
.card{background:#fff;border:1px solid var(--ft-border);border-radius:8px;padding:20px;margin-bottom:16px;box-shadow:var(--sh-sm)}
.login input{display:block;width:100%;max-width:320px;padding:10px;margin:8px 0;font:inherit;border:1px solid var(--ft-border);border-radius:4px}
.btn{font:inherit;font-weight:500;font-size:13px;border-radius:4px;padding:9px 16px;cursor:pointer;border:1px solid transparent;background:var(--ft-indigo);color:#fff}
.btn--danger{background:var(--ft-rouge)}
.btn--sm{padding:5px 10px;font-size:12px}
.toolbar-admin{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.badge{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;margin-left:6px}
.badge--type{background:rgba(0,0,0,.08);color:var(--ft-navy)}
.badge--pending{background:#FBE3E3;color:var(--ft-rouge)}
.badge--groupe{background:var(--ft-orange-light);color:var(--ft-orange)}
.prop{border:1px solid var(--ft-border);border-radius:6px;padding:14px;margin-bottom:12px;background:var(--ft-jaune-light);display:flex;gap:10px}
.prop.modif{background:var(--ft-bordeaux-light)}
.prop.suppr{background:#FBE3E3}
.prop-body{flex:1;min-width:0}
.prop h3{margin:0 0 4px;font-size:14px}
.meta{font-size:11.5px;color:var(--ft-gray-500);margin-bottom:8px}
.comment-box{font-size:12px;background:rgba(255,255,255,.6);border:1px dashed var(--ft-gray-300);border-radius:4px;padding:8px 10px;margin:8px 0}
.field-block{margin:10px 0}
.field-block label{display:block;font-size:11.5px;font-weight:700;margin-bottom:2px}
.avant{font-size:11.5px;color:var(--ft-gray-500);margin-bottom:3px}
.avant.changed{color:var(--ft-rouge)}
.prop input,.prop textarea,.prop select{width:100%;padding:6px 8px;font:inherit;border:1px solid var(--ft-border);border-radius:4px}
.prop select[multiple]{min-height:90px}
.prop textarea{min-height:50px}
.actions{display:flex;gap:8px;margin-top:10px}
.empty{color:var(--ft-gray-500);font-style:italic}
.check-col{flex:none;padding-top:2px}
.check-col input{width:auto}
.field-picker{max-height:160px;overflow-y:auto;border:1px solid var(--ft-border);border-radius:4px;padding:6px 8px;background:#fff}
.field-picker-row{display:block;font-size:12.5px;padding:2px 0;cursor:pointer}
.field-picker-row input{width:auto;margin-right:6px}
</style>
</head>
<body>

<header class="site">
  <div class="site-inner">
    <img src="assets/republique-francaise-rpe.png" alt="République Française - Réseau Pour l'Emploi">
    <div class="site-title">
      <h1>Administration du glossaire RPE</h1>
      <div class="sub">Validation des propositions de contribution</div>
    </div>
    <a class="admin-link" href="index.html">&larr; Retour au glossaire public</a>
  </div>
</header>

<main>
  <div class="card login" id="loginCard">
    <h2>Connexion administrateur</h2>
    <input type="email" id="loginEmail" placeholder="Email admin">
    <input type="password" id="loginPass" placeholder="Mot de passe">
    <button class="btn" id="btnLogin">Se connecter</button>
    <div id="loginError" style="color:var(--ft-rouge);font-size:12.5px;margin-top:6px"></div>
  </div>

  <div id="adminPanel" style="display:none">
    <div class="card toolbar-admin">
      <h2 style="margin:0">Propositions en attente</h2>
      <div style="display:flex;gap:8px">
        <button class="btn btn--sm" id="btnSelectAll">Tout sélectionner</button>
        <button class="btn btn--sm" id="btnValidateSelection">Valider la sélection</button>
        <button class="btn btn--sm" id="btnLogout">Se déconnecter</button>
      </div>
    </div>
    <div id="propList"></div>
  </div>
</main>

<footer class="site">
  <div class="inner">
    <img class="footer-icon" src="assets/tdb-rpe-icon.svg" alt="">
    <span class="footer-title">Glossaire du tableau de bord RPE - Administration</span>
    <img class="footer-ft-logo" src="assets/logo-france-travail.svg" alt="France Travail">
    <span class="footer-copy">© 2026 France Travail dans le cadre de sa mission d'appui au Réseau Pour l'Emploi</span>
  </div>
</footer>

<script>
document.addEventListener('DOMContentLoaded', function(){

firebase.initializeApp(FIREBASE_CONFIG);
var auth = firebase.auth();
var db = firebase.firestore();

var publishedById = {};
var pendingCountsAdmin = {};
var refPages = [];
var refSources = [];

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmt(v){
  if (v == null) return '';
  if (Array.isArray(v)) {
    if (v.length && typeof v[0] === 'object') return v.map(function(m){ return m.valeur + ' : ' + (m.regle||''); }).join('\n');
    return v.join(', ');
  }
  return String(v);
}
function groupCount(groupName){
  if (!groupName) return 0;
  var n = 0;
  Object.keys(publishedById).forEach(function(id){ if (publishedById[id].groupe === groupName) n++; });
  return n;
}

function loadPublished(cb){
  var pJson = fetch('data/glossary.json').then(function(r){ return r.json(); });
  var pRef = fetch('data/pages_sources.json').then(function(r){ return r.json(); }).catch(function(){ return {pages:[],sources:[]}; });
  var pOverrides = db.collection('glossaire_overrides').get();
  var pAjouts = db.collection('glossaire_ajouts').get();
  var pCompteurs = db.collection('compteurs').get();

  Promise.all([pJson, pRef, pOverrides, pAjouts, pCompteurs]).then(function(results){
    var base = results[0];
    refPages = results[1].pages || [];
    refSources = results[1].sources || [];
    var overrides = {};
    results[2].forEach(function(doc){ overrides[doc.id] = doc.data(); });
    var additions = [];
    results[3].forEach(function(doc){ var d = doc.data(); d.id = doc.id; additions.push(d); });
    var all = base.concat(additions);
    all.forEach(function(e){
      var ov = overrides[e.id];
      publishedById[e.id] = ov ? Object.assign({}, e, ov) : e;
    });
    pendingCountsAdmin = {};
    results[4].forEach(function(doc){
      var n = doc.data().en_attente || 0;
      if (n > 0) pendingCountsAdmin[doc.id] = n;
    });
    cb();
  });
}

document.getElementById('btnLogin').addEventListener('click', function(){
  var email = document.getElementById('loginEmail').value.trim();
  var pass = document.getElementById('loginPass').value;
  auth.signInWithEmailAndPassword(email, pass).catch(function(err){
    document.getElementById('loginError').textContent = 'Connexion refusée : ' + err.message;
  });
});
document.getElementById('btnLogout').addEventListener('click', function(){ auth.signOut(); });

auth.onAuthStateChanged(function(user){
  var isAdmin = user && ADMIN_EMAILS.indexOf(user.email) > -1;
  document.getElementById('loginCard').style.display = isAdmin ? 'none' : 'block';
  document.getElementById('adminPanel').style.display = isAdmin ? 'block' : 'none';
  if (isAdmin) loadPublished(loadPropositions);
});

var FIELD_LABELS = {
  libelle: 'Libellé court', definition: 'Définition', modalites: 'Modalités (Valeur : règle, une par ligne)',
  periode_calcul: 'Période de calcul', cas_usage: "Cas d'usage", pages: 'Pages', sources: 'Sources', type: 'Type',
  groupe: 'Groupe (définitions proches)',
  hierarchie_nom: 'Variable hiérarchique - nom du référentiel',
  hierarchie_niveau: 'Variable hiérarchique - niveau (0 = plus détaillé)'
};

function flattenHierarchie(obj){
  if (!obj) return obj;
  var out = Object.assign({}, obj);
  if (out.hierarchie) {
    out.hierarchie_nom = out.hierarchie.nom || '';
    out.hierarchie_niveau = out.hierarchie.niveau != null ? out.hierarchie.niveau : '';
    delete out.hierarchie;
  }
  return out;
}

function fieldOrderFor(type){
  var base = ['type','libelle','definition'];
  if (type === 'mesure') base.push('periode_calcul'); else base.push('modalites');
  base.push('cas_usage','pages','sources','groupe','hierarchie_nom','hierarchie_niveau');
  return base;
}

function optionsHtml(values, selectedList){
  return values.map(function(v){
    var sel = selectedList.indexOf(v) > -1 ? ' selected' : '';
    return '<option value="' + escapeHtml(v) + '"' + sel + '>' + escapeHtml(v) + '</option>';
  }).join('');
}

function existingGroupNames(){
  var out = [];
  Object.keys(publishedById).forEach(function(id){
    var g = publishedById[id].groupe;
    if (g && out.indexOf(g) === -1) out.push(g);
  });
  return out.sort(function(a,b){ return a.localeCompare(b,'fr'); });
}
function existingHierNames(){
  var out = [];
  Object.keys(publishedById).forEach(function(id){
    var h = publishedById[id].hierarchie;
    if (h && h.nom && out.indexOf(h.nom) === -1) out.push(h.nom);
  });
  return out.sort(function(a,b){ return a.localeCompare(b,'fr'); });
}
function datalistHtml(id, values){
  return '<datalist id="' + id + '">' + values.map(function(v){ return '<option value="' + escapeHtml(v) + '">'; }).join('') + '</datalist>';
}
function fieldPickerHtml(name, selectedIds){
  var rows = Object.keys(publishedById).sort(function(a,b){
    return publishedById[a].libelle.localeCompare(publishedById[b].libelle, 'fr');
  }).map(function(id){
    var sel = selectedIds.indexOf(id) > -1 ? ' checked' : '';
    return '<label class="field-picker-row"><input type="checkbox" data-fp="' + name + '" value="' + escapeHtml(id) + '"' + sel + '> ' + escapeHtml(publishedById[id].libelle) + '</label>';
  }).join('');
  return '<div class="field-picker">' + rows + '</div>';
}

function loadPropositions(){
  db.collection('propositions').where('statut','==','en_attente').get().then(function(snap){
    var list = document.getElementById('propList');
    list.innerHTML = '';
    if (snap.empty) { list.innerHTML = '<div class="card empty">Aucune proposition en attente.</div>'; return; }
    snap.forEach(function(doc){
      var p = doc.data();
      var c = flattenHierarchie(p.champs || {});
      var published = flattenHierarchie(p.cible_id ? publishedById[p.cible_id] : null);
      var div = document.createElement('div');
      div.className = 'prop card ' + (p.type === 'modification' ? 'modif' : ((p.type === 'suppression' || p.type === 'groupe_suppression' || p.type === 'hierarchie_suppression') ? 'suppr' : ''));
      div.dataset.id = doc.id;
      div.dataset.cible = p.cible_id || '';
      div.dataset.ptype = p.type;
      div.dataset.email = p.email || '';
      div.dataset.origChamps = JSON.stringify(c);

      var titre = p.type === 'ajout' ? 'Ajout : ' + escapeHtml(c.libelle) :
                  p.type === 'suppression' ? 'Suppression demandée : ' + escapeHtml(c.libelle || p.cible_id) :
                  p.type === 'groupe_lot' ? 'Groupe (lot) : ' + escapeHtml(c.groupe) :
                  p.type === 'hierarchie_lot' ? 'Hiérarchie (lot) : ' + escapeHtml(c.hierarchie_nom) :
                  p.type === 'groupe_suppression' ? 'Suppression du groupe : ' + escapeHtml(c.groupe) :
                  p.type === 'hierarchie_suppression' ? 'Suppression de la hiérarchie : ' + escapeHtml(c.hierarchie_nom) :
                  'Modification de : ' + escapeHtml((published && published.libelle) || p.cible_id);
      var totalPending = p.cible_id ? (pendingCountsAdmin[p.cible_id] || 0) : 0;
      var pendingTag = totalPending > 1 ? '<span class="badge badge--pending">' + totalPending + ' demandes au total</span>' : '';
      var groupeTag = c.groupe ? '<span class="badge badge--groupe">Groupe : ' + escapeHtml(c.groupe) + ' · ' + groupCount(c.groupe) + ' champs</span>' : '';

      var bodyHtml = '<h3>' + titre + '<span class="badge badge--type">' + p.type + '</span>' + pendingTag + groupeTag + '</h3>' +
        '<div class="meta">Proposé par : ' + escapeHtml(p.email) + '</div>';

      if (c.commentaire) {
        bodyHtml += '<div class="comment-box"><b>Commentaire du contributeur :</b> ' + escapeHtml(c.commentaire) + '</div>';
      }

      if (p.type === 'suppression') {
        bodyHtml += '<div>Cette donnée sera masquée du glossaire public si vous validez.</div>';
      } else if (p.type === 'groupe_suppression') {
        bodyHtml += '<div>Le rattachement au groupe "' + escapeHtml(c.groupe) + '" sera retiré de ' + groupCount(c.groupe) + ' champ(s) si vous validez (les champs eux-mêmes ne sont pas supprimés).</div>';
      } else if (p.type === 'hierarchie_suppression') {
        bodyHtml += '<div>Le rattachement à la hiérarchie "' + escapeHtml(c.hierarchie_nom) + '" sera retiré des champs concernés si vous validez (les champs eux-mêmes ne sont pas supprimés).</div>';
      } else if (p.type === 'groupe_lot') {
        bodyHtml += '<div class="field-block"><label>Nom du groupe</label><input data-f="groupe" value="' + escapeHtml(c.groupe) + '"></div>';
        bodyHtml += '<div class="field-block"><label>Champs du groupe (décochez pour retirer)</label>' + fieldPickerHtml('membres', c.membres || []) + '</div>';
      } else if (p.type === 'hierarchie_lot') {
        bodyHtml += '<div class="field-block"><label>Nom de la hiérarchie</label><input data-f="hierarchie_nom" value="' + escapeHtml(c.hierarchie_nom) + '"></div>';
        var niveaux = c.niveaux || [];
        var n = niveaux.length;
        niveaux.forEach(function(lvl, idx){
          var ids = lvl && lvl.ids ? lvl.ids : [];
          var niveauValue = n - 1 - idx;
          var suffix = idx === 0 ? ' (le plus agrégé)' : (idx === n - 1 ? ' (le plus détaillé)' : '');
          bodyHtml += '<div class="field-block"><label>Niveau ' + niveauValue + suffix + '</label>' + fieldPickerHtml('niveau_' + idx, ids) + '</div>';
        });
      } else {
        var dlGroupesId = 'dl_groupes_' + doc.id;
        var dlHierId = 'dl_hier_' + doc.id;
        bodyHtml += datalistHtml(dlGroupesId, existingGroupNames()) + datalistHtml(dlHierId, existingHierNames());
        fieldOrderFor(c.type).forEach(function(key){
          if (!(key in c) && key !== 'hierarchie_nom' && key !== 'hierarchie_niveau') return;
          var apres = fmt(c[key]);
          var avant = published ? fmt(published[key]) : '';
          var changed = p.type === 'modification' && avant !== apres;
          var input;
          if (key === 'pages') {
            input = '<select multiple data-f="pages">' + optionsHtml(refPages, c.pages || []) + '</select>';
          } else if (key === 'sources') {
            input = '<select multiple data-f="sources">' + optionsHtml(refSources, c.sources || []) + '</select>';
          } else if (key === 'groupe') {
            input = '<input data-f="groupe" list="' + dlGroupesId + '" value="' + escapeHtml(apres) + '">';
          } else if (key === 'hierarchie_nom') {
            input = '<input data-f="hierarchie_nom" list="' + dlHierId + '" value="' + escapeHtml(apres) + '">';
          } else if (key === 'hierarchie_niveau') {
            input = '<input data-f="hierarchie_niveau" value="' + escapeHtml(apres) + '">';
          } else if (key === 'definition' || key === 'modalites' || key === 'cas_usage') {
            input = '<textarea data-f="' + key + '">' + escapeHtml(apres) + '</textarea>';
          } else {
            input = '<input data-f="' + key + '" value="' + escapeHtml(apres) + '">';
          }
          bodyHtml += '<div class="field-block">' +
            '<label>' + FIELD_LABELS[key] + '</label>' +
            (p.type === 'modification' ? '<div class="avant' + (changed ? ' changed' : '') + '">Avant : ' + escapeHtml(avant || '(vide)') + '</div>' : '') +
            input +
            '</div>';
        });
      }

      bodyHtml += '<div class="actions">' +
        '<button class="btn btn--sm" data-action="valider">Valider</button>' +
        '<button class="btn btn--sm btn--danger" data-action="supprimer">Rejeter</button>' +
      '</div>';

      div.innerHTML = '<div class="check-col"><input type="checkbox" class="propCheck"></div><div class="prop-body">' + bodyHtml + '</div>';
      list.appendChild(div);
    });
  });
}

function readForm(div){
  var champs = {};
  div.querySelectorAll('[data-f]').forEach(function(el){
    var key = el.dataset.f;
    if (key === 'pages' || key === 'sources') {
      champs[key] = Array.prototype.filter.call(el.options, function(o){ return o.selected; }).map(function(o){ return o.value; });
      return;
    }
    var val = el.value.trim();
    if (key === 'modalites') {
      var lines = val.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
      champs[key] = lines.length ? lines.map(function(l){
        var idx = l.indexOf(':');
        return idx === -1 ? {valeur:l, regle:''} : {valeur:l.slice(0,idx).trim(), regle:l.slice(idx+1).trim()};
      }) : null;
    } else {
      champs[key] = val;
    }
  });
  var niveauRaw = champs.hierarchie_niveau;
  var hierNom = champs.hierarchie_nom || '';
  delete champs.hierarchie_niveau;
  delete champs.hierarchie_nom;
  var hasNiveau = niveauRaw !== undefined && niveauRaw !== '' && !isNaN(niveauRaw);
  champs.hierarchie = (hierNom || hasNiveau) ? {nom: hierNom || null, niveau: hasNiveau ? parseInt(niveauRaw, 10) : null} : null;
  return champs;
}

function readFieldPicker(div, name){
  return Array.prototype.filter.call(div.querySelectorAll('[data-fp="' + name + '"]'), function(cb){ return cb.checked; })
    .map(function(cb){ return cb.value; });
}
function countNiveauRows(div){
  var max = -1;
  div.querySelectorAll('[data-fp]').forEach(function(cb){
    var m = /^niveau_(\d+)$/.exec(cb.dataset.fp);
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  return max + 1;
}

function slugify(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}

function sendPrefilledEmail(div, statusWord, champsFinal){
  var email = div.dataset.email;
  if (!email) return;
  var libelle = (champsFinal && champsFinal.libelle) || JSON.parse(div.dataset.origChamps || '{}').libelle || div.dataset.cible || '';
  var subject = 'Modification du glossaire du tableau de bord RPE ' + statusWord + ' : ' + libelle;
  var body = 'Bonjour,\n\nVotre proposition concernant "' + libelle + '" a été ' + statusWord + ' par l\'administrateur du glossaire du tableau de bord RPE.\n\nMerci pour votre contribution.\n\nCordialement,\nL\'équipe RPE';
  var a = document.createElement('a');
  a.href = 'mailto:' + encodeURIComponent(email) + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function fieldsDiffer(orig, champs){
  var keys = Object.keys(champs);
  for (var i=0;i<keys.length;i++){
    var k = keys[i];
    if (JSON.stringify(orig[k] != null ? orig[k] : null) !== JSON.stringify(champs[k] != null ? champs[k] : null)) return true;
  }
  return false;
}

function validateOne(div){
  var propId = div.dataset.id;
  var ptype = div.dataset.ptype;
  var cibleId = div.dataset.cible;
  if (ptype === 'suppression') {
    return db.collection('glossaire_overrides').doc(cibleId).set({supprime:true}, {merge:true}).then(function(){
      return db.collection('propositions').doc(propId).update({statut:'validee'});
    }).then(function(){ return decrementCounter(cibleId); }).then(function(){
      sendPrefilledEmail(div, 'validée');
    });
  }
  if (ptype === 'groupe_suppression') {
    var champsOrig = JSON.parse(div.dataset.origChamps || '{}');
    var nom = champsOrig.groupe;
    var ids = Object.keys(publishedById).filter(function(id){ return publishedById[id].groupe === nom; });
    return Promise.all(ids.map(function(id){
      return db.collection('glossaire_overrides').doc(id).set({groupe: null}, {merge:true});
    })).then(function(){
      return db.collection('propositions').doc(propId).update({statut:'validee'});
    }).then(function(){
      sendPrefilledEmail(div, 'validée', {libelle: 'suppression du groupe "' + nom + '"'});
    });
  }
  if (ptype === 'hierarchie_suppression') {
    var champsOrigH = JSON.parse(div.dataset.origChamps || '{}');
    var nomH = champsOrigH.hierarchie_nom;
    var idsH = Object.keys(publishedById).filter(function(id){
      return publishedById[id].hierarchie && publishedById[id].hierarchie.nom === nomH;
    });
    return Promise.all(idsH.map(function(id){
      return db.collection('glossaire_overrides').doc(id).set({hierarchie: null}, {merge:true});
    })).then(function(){
      return db.collection('propositions').doc(propId).update({statut:'validee'});
    }).then(function(){
      sendPrefilledEmail(div, 'validée', {libelle: 'suppression de la hiérarchie "' + nomH + '"'});
    });
  }
  if (ptype === 'groupe_lot') {
    var nomGroupe = div.querySelector('[data-f="groupe"]').value.trim();
    var membresIds = readFieldPicker(div, 'membres');
    return Promise.all(membresIds.map(function(id){
      return db.collection('glossaire_overrides').doc(id).set({groupe: nomGroupe}, {merge:true});
    })).then(function(){
      return db.collection('propositions').doc(propId).update({statut:'validee'});
    }).then(function(){
      sendPrefilledEmail(div, 'validée', {libelle: 'groupe "' + nomGroupe + '" (' + membresIds.length + ' champs)'});
    });
  }
  if (ptype === 'hierarchie_lot') {
    var nomHier = div.querySelector('[data-f="hierarchie_nom"]').value.trim();
    var nbNiveaux = countNiveauRows(div);
    var writes = [];
    for (var i = 0; i < nbNiveaux; i++) {
      var niveauValue = nbNiveaux - 1 - i;
      readFieldPicker(div, 'niveau_' + i).forEach(function(id){
        writes.push(db.collection('glossaire_overrides').doc(id).set({hierarchie: {nom: nomHier, niveau: niveauValue}}, {merge:true}));
      });
    }
    return Promise.all(writes).then(function(){
      return db.collection('propositions').doc(propId).update({statut:'validee'});
    }).then(function(){
      sendPrefilledEmail(div, 'validée', {libelle: 'hiérarchie "' + nomHier + '"'});
    });
  }
  var champs = readForm(div);
  var orig = JSON.parse(div.dataset.origChamps || '{}');
  var statusWord = fieldsDiffer(orig, champs) ? 'modifiée' : 'validée';
  var targetId = cibleId || slugify(champs.libelle);
  var coll = ptype === 'modification' ? 'glossaire_overrides' : 'glossaire_ajouts';
  return db.collection(coll).doc(targetId).set(champs, {merge:true}).then(function(){
    return db.collection('propositions').doc(propId).update({statut:'validee'});
  }).then(function(){ return decrementCounter(cibleId); }).then(function(){
    sendPrefilledEmail(div, statusWord, champs);
  });
}

function decrementCounter(cibleId){
  if (!cibleId) return Promise.resolve();
  return db.collection('compteurs').doc(cibleId).set(
    {en_attente: firebase.firestore.FieldValue.increment(-1)}, {merge:true}
  );
}

function rejectOne(div){
  var cibleId = div.dataset.cible;
  return db.collection('propositions').doc(div.dataset.id).update({statut:'rejetee'}).then(function(){
    return decrementCounter(cibleId);
  }).then(function(){
    sendPrefilledEmail(div, 'rejetée');
  });
}

document.getElementById('propList').addEventListener('click', function(ev){
  var btn = ev.target.closest('[data-action]');
  if (!btn) return;
  var div = ev.target.closest('.prop');
  var action = btn.dataset.action;
  if (action === 'supprimer') { rejectOne(div).then(function(){ div.remove(); }); return; }
  validateOne(div).then(function(){ div.remove(); });
});

document.getElementById('btnSelectAll').addEventListener('click', function(){
  var boxes = document.querySelectorAll('.propCheck');
  var allChecked = Array.prototype.every.call(boxes, function(b){ return b.checked; });
  boxes.forEach(function(b){ b.checked = !allChecked; });
});

document.getElementById('btnValidateSelection').addEventListener('click', function(){
  var checked = Array.prototype.filter.call(document.querySelectorAll('.propCheck'), function(b){ return b.checked; });
  if (!checked.length) return;
  var divs = checked.map(function(b){ return b.closest('.prop'); });
  Promise.all(divs.map(validateOne)).then(function(){ divs.forEach(function(d){ d.remove(); }); });
});

});
</script>
</body>
</html>
