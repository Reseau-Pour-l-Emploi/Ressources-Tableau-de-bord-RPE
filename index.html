<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script data-goatcounter="https://denisft.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<title>Accueil - Ressources Tableau de bord RPE</title>
<link rel="icon" type="image/svg+xml" href="assets/tdb-rpe-icon.svg">
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script defer src="firebase-config.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
@font-face{font-family:'Marianne';src:url('fonts/Marianne-Light.woff2') format('woff2');font-weight:300;font-display:swap}
@font-face{font-family:'Marianne';src:url('fonts/Marianne-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Marianne';src:url('fonts/Marianne-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Marianne';src:url('fonts/Marianne-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
:root{
  --ft-navy:#0D1440; --ft-indigo:#293378; --ft-indigo-dark:#1C2456; --ft-indigo-light:#E3E5F1;
  --ft-violet:#7E58A0; --ft-violet-light:#ECE6F2;
  --ft-jaune:#FFCC52; --ft-jaune-dark:#E0A800; --ft-jaune-light:#FFF4D6;
  --ft-bleu:#406BDE; --ft-bleu-light:#E2E8FB;
  --ft-orange:#D96B00; --ft-orange-light:#FCEADB;
  --ft-rouge:#D92424; --ft-bordeaux:#5C0F38; --ft-bordeaux-light:#EFDCE6;
  --ft-sable:#F5F2EE; --ft-sable-dark:#E6E1DB;
  --ft-gray-200:#E5E7EB; --ft-gray-300:#D1D5DB; --ft-gray-400:#9CA3AF; --ft-gray-500:#6B7280; --ft-gray-700:#374151;
  --ft-white:#FFFFFF;
  --ft-fg-1:var(--ft-navy); --ft-fg-2:var(--ft-gray-700); --ft-fg-3:var(--ft-gray-500);
  --ft-border:var(--ft-gray-200);
  --ft-font:'Marianne',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  --sh-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh-md:0 4px 10px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--ft-font);font-size:14px;line-height:1.6;color:var(--ft-fg-1);background:var(--ft-white)}
a{color:var(--ft-indigo)}
header.site{background:var(--ft-white);border-bottom:1px solid var(--ft-border);position:sticky;top:0;z-index:1100}
.site-inner{max-width:1500px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.site-inner img{height:40px}
.site-title{flex:1}
.site-title h1{font-size:17px;font-weight:700;margin:0;line-height:1.25}
.admin-link{font-size:12px;font-weight:600;color:var(--ft-indigo);text-decoration:none;border:1px solid var(--ft-indigo);border-radius:4px;padding:6px 12px;white-space:nowrap}
.admin-link:hover{background:var(--ft-indigo-light)}
.site-nav{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.nav-link{font-size:13.5px;font-weight:600;color:var(--ft-fg-2);text-decoration:none;padding:6px 2px;border-bottom:2px solid transparent}
.nav-link:hover{color:var(--ft-indigo)}
.nav-link.active{color:var(--ft-indigo);border-bottom-color:var(--ft-indigo)}
.nav-cta{font-size:13px;font-weight:700;color:#fff;background:var(--ft-indigo);text-decoration:none;padding:9px 16px;border-radius:999px;white-space:nowrap}
.nav-cta:hover{background:var(--ft-indigo-dark)}
main{max-width:1360px;margin:0 auto;padding:0 24px 56px}
footer.site{border-top:1px solid var(--ft-border);background:var(--ft-white);margin-top:24px}
footer.site .inner{max-width:1500px;margin:0 auto;padding:16px 24px;font-size:12px;color:var(--ft-fg-3);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px}
.footer-center{grid-column:2;display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:center;text-align:center}
.footer-ecoindex{grid-column:3;justify-self:end;display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ft-fg-3);white-space:nowrap}
.footer-ecoindex:hover{color:var(--ft-indigo)}
.ecoindex-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:4px;background:#2E7D32;color:#fff;font-weight:700;font-size:12px}
.footer-icon{height:26px;width:auto;flex:none}
.footer-title{font-weight:700;color:var(--ft-fg-1);font-size:13px;white-space:nowrap}
.footer-ft-logo{height:30px;width:auto;flex:none}

/* ==== Hero / intro (pleine largeur, 2 colonnes, degrade) ==== */
.hero-band{background:linear-gradient(135deg,var(--ft-navy),var(--ft-indigo));color:#fff}
.hero{max-width:1360px;margin:0 auto;padding:40px 24px;display:grid;grid-template-columns:1.15fr 1fr;gap:36px;align-items:start}
@media (max-width:900px){.hero{grid-template-columns:1fr;padding:28px 24px}}
.hero h2{margin:0 0 14px;font-size:24px;line-height:1.3;color:#fff}
.hero-text p{margin:0 0 10px;font-size:13.5px;color:#E3E5F1}
.hero-text ul{margin:0 0 14px;padding-left:20px}
.hero-text li{font-size:13.5px;color:#E3E5F1;margin-bottom:4px}
.hero-text strong{color:#fff}
.hero-summary{cursor:pointer}
.hero-summary:hover{text-decoration:underline}
.hero-full{display:none}
.hero-text[data-expanded="1"] .hero-summary{display:none}
.hero-text[data-expanded="1"] .hero-full{display:block}
.hero-toggle{display:inline-block;background:none;border:none;color:#B9C0E8;font-weight:600;font-size:12.5px;padding:0 0 8px;cursor:pointer;font-family:inherit}
.hero-toggle:hover{color:#fff;text-decoration:underline}
.hero .hero-cta{display:inline-block;background:var(--ft-jaune);color:var(--ft-navy);font-weight:700;text-decoration:none;padding:12px 24px;border-radius:999px;font-size:14.5px;margin-top:6px}
.hero .hero-cta:hover{background:var(--ft-jaune-dark)}
.hero-links{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.hero-links{grid-template-columns:1fr}}
.hero-link-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:14px 16px;transition:background .15s}
.hero-link-card:hover{background:rgba(255,255,255,.16)}
.hero-link-card a{color:#fff;font-weight:600;text-decoration:none;display:block;font-size:12.5px}
.hero-link-card a:hover{text-decoration:underline}
.hero-link-card .cat{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#B9C0E8;margin-bottom:5px;font-weight:700}

/* ==== Grille principale : contenu + colonne laterale flottante ==== */
.page-grid{display:grid;grid-template-columns:1fr 320px;gap:24px;margin-top:28px;align-items:start}
@media (max-width:960px){.page-grid{grid-template-columns:1fr}}
.main-col{min-width:0}
.side-col{position:sticky;top:74px;display:flex;flex-direction:column;gap:18px}
@media (max-width:960px){.side-col{position:static}}

/* ==== Sections generiques : sobre, sans ombre, bordure fine ==== */
.section{background:var(--ft-white);border:1px solid var(--ft-border);border-radius:10px;padding:22px 24px;margin-bottom:22px;box-shadow:var(--sh-sm)}
.section-tinted-actu{background:var(--ft-bleu-light)}
.section-tinted-kiosque{background:var(--ft-violet-light)}
.section-tinted-res{background:var(--ft-jaune-light)}
.section h3{margin:0 0 14px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--ft-navy)}
.item-row{border:1px solid var(--ft-border);border-radius:5px;padding:11px 13px;margin-bottom:8px;background:var(--ft-sable)}
.item-row:last-child{margin-bottom:0}
.item-row .item-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.item-row .item-titre{font-weight:700;font-size:13px}
.item-row .item-date{font-size:11px;color:var(--ft-fg-3);white-space:nowrap}
.item-row .item-desc{font-size:12.5px;color:var(--ft-fg-2);margin-top:4px}
.item-row .item-liens{margin-top:7px;display:flex;gap:14px;flex-wrap:wrap}
.item-row .item-liens a{font-size:12.5px;font-weight:600;text-decoration:none}
.item-row .item-liens a:hover{text-decoration:underline}
.empty-hint{color:var(--ft-fg-3);font-style:italic;font-size:12.5px}
.show-more-btn{display:block;margin:14px auto 0;background:none;border:1px solid var(--ft-indigo);color:var(--ft-indigo);font-weight:700;font-size:12.5px;padding:8px 18px;border-radius:999px;cursor:pointer;font-family:inherit}
.show-more-btn:hover{background:var(--ft-indigo-light)}
.hidden-item{display:none}

/* ==== Sidebar : agenda type calendrier ==== */
.agenda-card{background:var(--ft-white);border:1px solid var(--ft-border);border-radius:10px;padding:18px 20px;box-shadow:var(--sh-sm)}
.agenda-card h3{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;color:var(--ft-navy)}
.agenda-item{background:var(--ft-sable);border:1px solid var(--ft-border);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.agenda-item:last-child{margin-bottom:0}
.agenda-row{display:flex;gap:11px;align-items:flex-start}
.agenda-body{flex:1;min-width:0}
.cal-tile{flex:none;width:46px;text-align:center;border:1px solid var(--ft-border);border-radius:5px;overflow:hidden}
.cal-tile .cal-mois{background:var(--ft-indigo);color:#fff;font-size:9px;font-weight:700;padding:2px 0;letter-spacing:.03em}
.cal-tile .cal-jour{font-size:16px;font-weight:700;color:var(--ft-navy);padding:2px 0;background:#fff}
.cal-tile.cal-generic{display:flex;align-items:center;justify-content:center;height:38px;font-size:16px;border:1px solid var(--ft-border);background:#fff}
.agenda-body .item-titre{display:block;font-weight:700;font-size:12.5px}
.agenda-body .item-desc{font-size:11.5px;color:var(--ft-fg-3);margin-top:2px}
.agenda-item .tile-linkbar{margin-top:8px;border-radius:5px;background:#fff}

/* ==== Sidebar : contact flottant (sobre) ==== */
.contact-card{background:linear-gradient(160deg,var(--ft-indigo),var(--ft-navy));color:#fff;border-radius:10px;padding:20px}
.contact-card h3{margin:0 0 10px;font-size:14px;font-weight:700}
.contact-card p{font-size:12.5px;color:#C9CEE8;margin:0 0 14px}
.contact-cta{display:block;text-align:center;background:var(--ft-jaune);color:var(--ft-navy);font-weight:700;text-decoration:none;padding:11px 16px;border-radius:999px;font-size:12.5px}
.contact-cta:hover{background:var(--ft-jaune-dark)}
.contact-note{background:rgba(255,255,255,.08);border-radius:4px;padding:10px 12px;font-size:11.5px;margin-top:14px;color:#C9CEE8}
.contact-note a{color:#fff}

/* ==== Actualites : grille de 3 vignettes ==== */
.actu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
@media (max-width:760px){.actu-grid{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.actu-grid{grid-template-columns:1fr}}
.actu-card{min-height:135px;border-top:3px solid var(--ft-bleu);border-radius:5px 5px 0 0;padding:13px 15px;background:#fff;display:flex;flex-direction:column;box-shadow:var(--sh-sm)}
.actu-card.actu-alerte{border-top-color:var(--ft-orange)}
.actu-icon{font-size:16px;flex:none}
.actu-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.actu-card .item-titre{font-size:13px;font-weight:700;flex:1}
.item-date-tag{flex:none;font-size:10px;color:var(--ft-fg-3);background:var(--ft-sable);border:1px solid var(--ft-border);border-radius:999px;padding:2px 8px;white-space:nowrap;margin-top:1px}
.actu-card .item-desc{font-size:12px;color:var(--ft-fg-2)}

/* ==== Le Kiosque : filtre + carrousel style SharePoint (fleches laterales + points) ==== */
.filmstrip-filter{display:block;margin-bottom:14px;max-width:260px;padding:8px 10px;font:inherit;font-size:12.5px;border:1px solid var(--ft-border);border-radius:4px;background:#fff}
.filmstrip{position:relative;padding:0 40px}
@media (max-width:600px){.filmstrip{padding:0}}
.filmstrip-grid{padding:2px;align-items:start}
.kiosque-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
.kiosque-card{min-height:135px;border:1px solid var(--ft-border);border-radius:5px 5px 0 0;border-bottom:none;padding:13px 15px;background:#fff;display:flex;flex-direction:column;position:relative}
.kiosque-card--latest{border:2px solid var(--ft-jaune-dark);border-bottom:none;padding-top:19px}
.kiosque-latest-tag{position:absolute;top:-11px;left:12px;background:var(--ft-jaune-dark);color:#fff;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 9px;border-radius:999px}
.kiosque-card .kiosque-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex:none}
.kiosque-card .item-date{font-size:10.5px;color:var(--ft-fg-3);font-weight:600}
.kiosque-type{font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;font-weight:700;color:var(--ft-violet);background:var(--ft-violet-light);padding:1px 7px;border-radius:3px}
.kiosque-card .item-titre{font-size:12.5px}

/* Zone de texte qui s'agrandit au survol si le contenu depasse (au lieu d'une superposition) */
.item-desc-clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;color:var(--ft-fg-2);margin-top:5px;line-height:1.5}
/* Popup de contenu complet (au clic sur une vignette) */
.tile-modal{display:none;position:absolute;z-index:2000;background:#fff;border-radius:8px;padding:16px 18px;max-width:320px;width:max-content;max-height:50vh;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.18);border:1px solid var(--ft-border)}
.tile-modal.open{display:block}
.tile-modal-meta{font-size:11px;color:var(--ft-fg-3);margin-bottom:6px}
.tile-modal h4{margin:0 0 10px;font-size:14.5px;color:var(--ft-navy)}
.tile-modal-body-text{font-size:13px;color:var(--ft-fg-2);line-height:1.6}
.tile-modal-links{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.tile-modal-links a{font-size:12.5px;font-weight:600;color:var(--ft-indigo);text-decoration:none;padding:8px 12px;border:1px solid var(--ft-border);border-radius:5px}
.tile-modal-links a:hover{background:var(--ft-indigo-light)}

/* ==== Roadmap : popup plein ecran ==== */
.roadmap-overlay{display:none;position:fixed;inset:0;background:var(--ft-white);z-index:3000;flex-direction:column}
.roadmap-overlay.open{display:flex}
.roadmap-header{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-bottom:1px solid var(--ft-border);flex:none}
.roadmap-header h2{margin:0;font-size:18px;color:var(--ft-navy)}
.roadmap-close{background:var(--ft-navy);color:#fff;border:none;border-radius:6px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.roadmap-close:hover{background:var(--ft-indigo-dark)}
.roadmap-legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 24px;border-bottom:1px solid var(--ft-border);flex:none;font-size:11.5px}
.roadmap-legend-item{display:flex;align-items:center;gap:6px}
.roadmap-legend-dot{width:11px;height:11px;border-radius:3px;flex:none}
.roadmap-body{flex:1;overflow:auto;padding:16px 24px 40px}

.roadmap-nav{display:flex;flex-direction:column;gap:8px;padding:12px 24px;border-bottom:1px solid var(--ft-border);flex:none;font-size:12px;background:var(--ft-sable)}
.rm-nav-row{display:flex;align-items:center;gap:10px}
.rm-nav-months{display:flex;gap:4px;flex:1}
.rm-nav-month-box{flex:1;font-family:inherit;font-size:11px;font-weight:600;color:var(--ft-fg-2);background:#fff;border:1px solid var(--ft-border);border-radius:5px;padding:7px 4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm-nav-month-box--today{background:var(--ft-jaune-light);border-color:var(--ft-jaune-dark);color:var(--ft-navy);font-weight:700}
.rm-nav-arrow{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--ft-border);background:#fff;color:var(--ft-navy);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.rm-nav-arrow:hover{background:var(--ft-indigo-light);border-color:var(--ft-indigo)}
.rm-nav-arrow:disabled{opacity:.35;cursor:default;pointer-events:none}
.rm-nav-toggle-row{display:flex;justify-content:flex-end;margin-top:8px}
.roadmap-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 24px;border-bottom:1px solid var(--ft-border);flex:none;font-size:12px;flex-wrap:wrap}
.roadmap-filter-label{display:flex;align-items:center;gap:7px;cursor:pointer;color:var(--ft-fg-2)}
.rm-domaine-count{color:var(--ft-fg-3);font-weight:400;font-size:11.5px}
.rm-domaine-count.rm-count-active{color:var(--ft-indigo);font-weight:700}
.roadmap-nav input[type=range]{flex:1;max-width:420px;accent-color:var(--ft-indigo)}

.rm-epic{border:1px solid var(--ft-border);border-radius:8px;margin-bottom:14px;overflow:hidden}
.rm-epic-head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--ft-sable);cursor:pointer;font-weight:700;color:var(--ft-navy);font-size:14.5px}
.rm-epic-head .rm-toggle{transition:transform .15s;flex:none}
.rm-epic.collapsed .rm-toggle{transform:rotate(-90deg)}
.rm-epic.collapsed .rm-epic-body{display:none}
.rm-epic-body{padding:12px 16px}

.rm-domaine{margin-bottom:16px}
.rm-domaine:last-child{margin-bottom:0}
.rm-domaine-head{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;color:var(--ft-fg-2);font-size:13px;padding:6px 0}
.rm-domaine-head .rm-toggle{transition:transform .15s;flex:none;font-size:11px}
.rm-domaine.collapsed .rm-toggle{transform:rotate(-90deg)}
.rm-domaine.collapsed .rm-domaine-body{display:none}
.rm-domaine-body{padding-left:6px}

.rm-timeline-scroll{overflow:hidden;border:1px solid var(--ft-border);border-radius:6px;background:#fff;max-width:920px;position:relative}
.rm-timeline-inner{position:relative;transition:transform .2s ease}
.rm-timeline-rows{position:relative}
.rm-timeline-row{position:relative;height:34px;border-bottom:1px solid var(--ft-border)}
.rm-timeline-row:last-child{border-bottom:none}
.rm-month-line{position:absolute;top:0;bottom:0;width:1px;background:var(--ft-border);z-index:1;pointer-events:none}
.rm-timeline-today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--ft-rouge);z-index:2;pointer-events:none}
.rm-bar{position:absolute;top:5px;height:24px;border-radius:5px;font-size:10.5px;color:#fff;overflow:hidden;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15);z-index:2}
.rm-bar-label{display:inline-block;white-space:nowrap;padding:0 8px;line-height:24px;transition:transform .1s linear}
.rm-bar--open{background-image:linear-gradient(to right,transparent calc(100% - 14px),rgba(255,255,255,.5) 100%)}
.rm-bar:hover{filter:brightness(1.1)}
.rm-no-date{font-size:12px;color:var(--ft-fg-3);padding:6px 0;font-style:italic}
.rm-task-popup{display:none;position:fixed;z-index:3100;background:#fff;border:1px solid var(--ft-border);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:14px 16px;max-width:320px;font-size:12.5px}
.rm-task-popup.open{display:block}
.rm-task-popup h5{margin:0 0 6px;font-size:13.5px;color:var(--ft-navy)}
.rm-task-popup .rm-task-dates{font-size:11px;color:var(--ft-fg-3);margin-top:8px;line-height:1.7}
.rm-task-popup .rm-task-updated{font-size:10.5px;color:var(--ft-fg-3);font-style:italic;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--ft-border)}

.section-head-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.section-head-row h3{margin:0}
.section-head-row .filmstrip-filter{margin-bottom:0;max-width:220px}

.tile-unit{display:flex;flex-direction:column}
[data-tile]{cursor:pointer}
.tile-roadmap-btn{align-self:flex-start;margin-top:8px;background:var(--ft-navy);border:none;color:#fff;font-weight:600;font-size:11px;padding:6px 13px;border-radius:999px;cursor:pointer;font-family:inherit}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* Popup generique affichant le contenu complet d'une vignette au survol de sa zone.
   Le texte y est normalement selectionnable/copiable (pas de restriction CSS dessus). */
function tileDataAttr(obj){
  return escapeHtml(JSON.stringify(obj));
}
function tileTitleHtml(it, d, cls){
  var attr = it.description ? ' data-tile="' + tileDataAttr(d) + '"' : '';
  return '<span class="' + cls + '"' + attr + '>' + richText(it.titre || '') + '</span>';
}
function tileDescPreviewHtml(it, d){
  if (!it.description) return '';
  return '<div class="item-desc-clamp" data-tile="' + tileDataAttr(d) + '">' + richText(it.description) + '</div>';
}
function positionTileModal(anchorEl){
  var modal = document.getElementById('tileModalOverlay');
  var rect = anchorEl.getBoundingClientRect();
  var mw = modal.offsetWidth || 320;
  var mh = modal.offsetHeight || 120;
  var top = window.scrollY + rect.bottom + 8;
  var left = window.scrollX + rect.left;
  var viewportW = document.documentElement.clientWidth;
  var viewportH = window.innerHeight;
  if (left + mw > window.scrollX + viewportW - 12) left = window.scrollX + viewportW - mw - 12;
  if (left < window.scrollX + 12) left = window.scrollX + 12;
  if (rect.bottom + mh + 8 > viewportH) top = window.scrollY + rect.top - mh - 8; // pas assez de place en dessous : au-dessus
  if (top < window.scrollY + 8) top = window.scrollY + 8;
  modal.style.top = top + 'px';
  modal.style.left = left + 'px';
}
function openTileModal(d, anchorEl){
  document.getElementById('tileModalMeta').textContent = d.meta || '';
  document.getElementById('tileModalMeta').style.display = d.meta ? 'block' : 'none';
  document.getElementById('tileModalTitle').innerHTML = richText(d.titre || '');
  document.getElementById('tileModalBody').innerHTML = d.desc ? richText(d.desc) : '';
  var liensHtml = (d.liens || []).filter(function(l){ return l.url; }).map(function(l){
    return '<a href="' + escapeHtml(l.url) + '" target="_blank" rel="noopener">' + escapeHtml(l.label) + ' →</a>';
  }).join('');
  document.getElementById('tileModalLinks').innerHTML = liensHtml;

function withinTileOrModal(el){

}
document.addEventListener('mouseover', function(ev){

});

/* Syntaxe legere pour le texte des vignettes : **gras**, *italique*, __souligne__,
   saut de ligne (Entree), "- " en debut de ligne = puce. Toujours echappe avant mise en forme
   (aucune injection HTML possible). */
function richInline(s){
  var esc = escapeHtml(s);
  esc = esc.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  esc = esc.replace(/__(.+?)__/g, '<u>$1</u>');
  esc = esc.replace(/\*(.+?)\*/g, '<em>$1</em>');
  return esc;
}
function richText(s){
  if (!s) return '';
  var lines = String(s).split('\n');
  return lines.map(function(line){
    var m = /^\s*-\s+(.*)$/.exec(line);
    var out = richInline(m ? m[1] : line);
    return m ? '&bull;&nbsp;' + out : out;
  }).join('<br>');
}

function parseDMY(dateStr){
  var m = /^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})$/.exec((dateStr || '').trim());
  if (!m) return null;
  var y = m[3].length === 2 ? '20' + m[3] : m[3];
  var d = new Date(parseInt(y,10), parseInt(m[2],10) - 1, parseInt(m[1],10));
  return isNaN(d.getTime()) ? null : d;
}
function today(){
  var t = new Date();
  return new Date(t.getFullYear(), t.getMonth(), t.getDate());
}

var MOIS_ABBR = ['JANV','FÉVR','MARS','AVR','MAI','JUIN','JUIL','AOÛT','SEPT','OCT','NOV','DÉC'];

function renderLiens(liens){

}

/* cadre de liens colle sous une vignette (carrousel), compartiments egaux, 3 liens max */
function renderLinkBar(liens){

/* agenda : presentation calendrier, les evenements passes (J+1) disparaissent */
function renderAgenda(items){
  var todayDate = today();
  var visibles = (items || []).filter(function(it){
    var d = parseDMY(it.date);
    return !d || d >= todayDate;
  });
  if (!visibles.length) return '<div class="empty-hint">Rien à afficher pour le moment.</div>';
  return visibles.map(function(it){
    var d = parseDMY(it.date);
    var tile = d
      ? '<div class="cal-tile"><div class="cal-mois">' + MOIS_ABBR[d.getMonth()] + '</div><div class="cal-jour">' + d.getDate() + '</div></div>'
      : '<div class="cal-tile cal-generic">🗓️</div>';
    var dateLine = (!d && it.date) ? '<div class="item-desc">' + escapeHtml(it.date) + '</div>' : '';
    var data = {titre: it.titre, desc: it.description || '', liens: it.liens || []};
    var titreLigne = tileTitleHtml(it, data, 'item-titre') + dateLine;
    return '<div class="agenda-item">' +
      '<div class="agenda-row">' + tile + '<div class="agenda-body">' + titreLigne + tileDescPreviewHtml(it, data) + '</div></div>' +
      renderLinkBar(it.liens) +

}

}
function isRoadmapCard(titre){

}
function renderActualites(items){

/* Le Kiosque : evenements passes uniquement (webinaires, newsletters, autres), tries du plus recent au plus ancien */
var kiosqueState = {items: [], filterType: 'tous', batch: 0};
var KIOSQUE_BATCH = 6;

function kiosquePassedItems(items){
  var todayDate = today();
  return (items || []).filter(function(it){
    var d = parseDMY(it.date);
    return !d || d <= todayDate;
  }).slice().sort(function(a, b){
    var da = parseDMY(a.date), db = parseDMY(b.date);
    if (!da && !db) return 0;
    if (!da) return 1;
    if (!db) return -1;
    return db - da;
  });
}

function kiosqueCardHtml(it, isLatest){
  var data = {titre: it.titre, desc: it.description || '', liens: it.liens || [], meta: [it.date, it.type].filter(Boolean).join(' · ')};
  return '<div class="tile-unit"><div class="kiosque-card' + (isLatest ? ' kiosque-card--latest' : '') + '">' +
    (isLatest ? '<span class="kiosque-latest-tag">Dernier ajout</span>' : '') +
    '<div class="kiosque-top">' +
      (it.date ? '<span class="item-date">' + escapeHtml(it.date) + '</span>' : '<span></span>') +
      (it.type ? '<span class="kiosque-type">' + escapeHtml(it.type) + '</span>' : '') +
    '</div>' +
    tileTitleHtml(it, data, 'item-titre') +
    tileDescPreviewHtml(it, data) +
  '</div>' + renderLinkBar(it.liens) + '</div>';
}

/* Carrousel generique style SharePoint : fleches laterales + points de pagination */
function filmstripControlsHtml(idPrefix, withAutoplay){
  return '<div class="filmstrip"><button type="button" class="filmstrip-btn prev" id="' + idPrefix + 'Prev" aria-label="Précédent">‹</button>' +
    '<div class="filmstrip-grid" id="' + idPrefix + 'Grid"></div>' +
    '<button type="button" class="filmstrip-btn next" id="' + idPrefix + 'Next" aria-label="Suivant">›</button></div>' +
    '<div class="filmstrip-dots-row">' +
      '<div class="filmstrip-dots" id="' + idPrefix + 'Dots"></div>' +
      (withAutoplay ? '<button type="button" class="filmstrip-autoplay-btn" id="' + idPrefix + 'Autoplay" aria-label="Mettre en pause">⏸</button>' : '') +
    '</div>';
}

function bindFilmstripControls(container, idPrefix, getState, renderFn){
  var prevBtn = container.querySelector('#' + idPrefix + 'Prev');
  var nextBtn = container.querySelector('#' + idPrefix + 'Next');
  if (!prevBtn) return;
  prevBtn.addEventListener('click', function(){ getState().batch -= 1; renderFn(); });
  nextBtn.addEventListener('click', function(){ getState().batch += 1; renderFn(); });
}

function renderFilmstripNav(idPrefix, totalBatches, currentBatch, onDotClick){
  var prevBtn = document.getElementById(idPrefix + 'Prev');
  var nextBtn = document.getElementById(idPrefix + 'Next');
  var dots = document.getElementById(idPrefix + 'Dots');
  if (totalBatches <= 1) {
    prevBtn.style.display = 'none';
    nextBtn.style.display = 'none';
    dots.innerHTML = '';
    return;
  }
  prevBtn.style.display = '';
  nextBtn.style.display = '';
  prevBtn.disabled = currentBatch <= 0;
  nextBtn.disabled = currentBatch >= totalBatches - 1;
  var dotsHtml = '';
  for (var i = 0; i < totalBatches; i++) {
    dotsHtml += '<button type="button" class="filmstrip-dot' + (i === currentBatch ? ' active' : '') + '" data-page="' + i + '" aria-label="Page ' + (i + 1) + '"></button>';
  }
  dots.innerHTML = dotsHtml;
  dots.querySelectorAll('[data-page]').forEach(function(dot){
    dot.addEventListener('click', function(){ onDotClick(parseInt(dot.dataset.page, 10)); });
  });
}

function renderKiosqueFilter(items){
  var passed = kiosquePassedItems(items);
  if (!passed.length) return '';
  var types = [];
  passed.forEach(function(it){ if (it.type && types.indexOf(it.type) === -1) types.push(it.type); });
  return '<select class="filmstrip-filter" id="kiosqueFilter">' +
    '<option value="tous">Tous les événements</option>' +
    types.map(function(t){ return '<option value="' + escapeHtml(t) + '">' + escapeHtml(t) + '</option>'; }).join('') +
  '</select>';
}

function renderKiosque(items){
  kiosqueState.items = kiosquePassedItems(items);
  kiosqueState.filterType = 'tous';
  kiosqueState.batch = 0;
  if (!kiosqueState.items.length) return '<div class="empty-hint">Rien à afficher pour le moment.</div>';
  return filmstripControlsHtml('kiosque');
}

function renderKiosqueGrid(){
  var grid = document.getElementById('kiosqueGrid');
  if (!grid) return;
  grid.className = 'filmstrip-grid kiosque-grid';
  var filtered = kiosqueState.items.filter(function(it){
    return kiosqueState.filterType === 'tous' || it.type === kiosqueState.filterType;
  });
  var totalBatches = Math.max(1, Math.ceil(filtered.length / KIOSQUE_BATCH));
  if (kiosqueState.batch >= totalBatches) kiosqueState.batch = totalBatches - 1;
  if (kiosqueState.batch < 0) kiosqueState.batch = 0;
  var start = kiosqueState.batch * KIOSQUE_BATCH;
  var pageItems = filtered.slice(start, start + KIOSQUE_BATCH);
  grid.innerHTML = pageItems.length
    ? pageItems.map(function(it, idx){ return kiosqueCardHtml(it, start === 0 && idx === 0); }).join('')
    : '<div class="empty-hint">Rien à afficher pour ce filtre.</div>';
  renderFilmstripNav('kiosque', totalBatches, kiosqueState.batch, function(page){ kiosqueState.batch = page; renderKiosqueGrid(); });
}

function bindKiosque(container){
  var filterSel = container.querySelector('#kiosqueFilter');
  if (!filterSel) return;
  filterSel.addEventListener('change', function(){
    kiosqueState.filterType = filterSel.value;
    kiosqueState.batch = 0;
    renderKiosqueGrid();
  });
  bindFilmstripControls(container, 'kiosque', function(){ return kiosqueState; }, renderKiosqueGrid);
  renderKiosqueGrid();
}

function ressourceCardHtml(it){

function renderRessourcesGrid(){

/* Defilement automatique du carrousel Ressources complementaires (façon "A la une"),
   avec pause au survol et bouton lecture/pause. */
var ressourcesAutoplayOn = true;
var ressourcesAutoplayTimer = null;
function stopResAutoplay(){
  if (ressourcesAutoplayTimer) clearInterval(ressourcesAutoplayTimer);
  ressourcesAutoplayTimer = null;
}
function startResAutoplay(){
  stopResAutoplay();
  var totalBatches = Math.max(1, Math.ceil(ressourcesState.items.length / RESSOURCES_BATCH));
  if (totalBatches <= 1) return;
  ressourcesAutoplayTimer = setInterval(function(){
    var tb = Math.max(1, Math.ceil(ressourcesState.items.length / RESSOURCES_BATCH));
    ressourcesState.batch = (ressourcesState.batch + 1) % tb;
    renderRessourcesGrid();
  }, 5000);
}
function setupResAutoplay(){
  var btn = document.getElementById('resAutoplay');
  var wrap = document.getElementById('resGrid') && document.getElementById('resGrid').closest('.filmstrip');
  if (!btn || !wrap) return;
  function updateBtn(){
    btn.innerHTML = ressourcesAutoplayOn ? '⏸' : '▶';
    btn.setAttribute('aria-label', ressourcesAutoplayOn ? 'Mettre en pause' : 'Lecture');
  }
  updateBtn();
  btn.addEventListener('click', function(){
    ressourcesAutoplayOn = !ressourcesAutoplayOn;
    updateBtn();
    if (ressourcesAutoplayOn) startResAutoplay(); else stopResAutoplay();
  });
  wrap.addEventListener('mouseenter', stopResAutoplay);
  wrap.addEventListener('mouseleave', function(){ if (ressourcesAutoplayOn) startResAutoplay(); });
}

function bindRessources(container){
  if (!container.querySelector('#resGrid')) return;
  bindFilmstripControls(container, 'res', function(){ return ressourcesState; }, renderRessourcesGrid);
  renderRessourcesGrid();
  setupResAutoplay();
}

/* Abonnement newsletter */
function ensureAnonAuth(){
  return new Promise(function(resolve, reject){
    if (auth.currentUser) { resolve(auth.currentUser); return; }
    auth.signInAnonymously().then(function(cred){ resolve(cred.user); }).catch(reject);
  });
}
function bindNewsletterForm(container){
  var box = container.querySelector('#newsletterBox');
  if (!box) return;
  var input = box.querySelector('#newsletterEmail');
  var status = box.querySelector('#newsletterStatus');
  function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
  box.querySelector('#btnSub').addEventListener('click', function(){
    var email = input.value.trim().toLowerCase();
    if (!validEmail(email)) { status.textContent = 'Adresse email invalide.'; return; }
    status.textContent = 'Inscription...';
    ensureAnonAuth().then(function(){
      return db.collection('newsletter_subscribers').doc(email).set({email: email, subscribed: true, date: new Date().toISOString()});
    }).then(function(){
      status.textContent = '✅ Vous êtes abonné(e) à la newsletter.';
    }).catch(function(err){
      status.textContent = '❌ Échec : ' + (err.message || err);
    });
  });
  box.querySelector('#btnUnsub').addEventListener('click', function(){
    var email = input.value.trim().toLowerCase();
    if (!validEmail(email)) { status.textContent = 'Adresse email invalide.'; return; }
    status.textContent = 'Désinscription...';
    ensureAnonAuth().then(function(){
      return db.collection('newsletter_subscribers').doc(email).delete();
    }).then(function(){
      status.textContent = '✅ Vous êtes désabonné(e).';
    }).catch(function(err){
      status.textContent = '❌ Échec : ' + (err.message || err);
    });
  });
}

    {nom: "Fiches action & Feuilles de route", domaines: [rmDomaine("Interface de saisie"), rmDomaine("Interface de consultation")]},
    {nom: "Pilotage territorial sur mesure", domaines: [rmDomaine("Catalogue d'indicateurs"), rmDomaine("Interface de sélection")]},
    {nom: "Socle Data & Modélisation", domaines: [rmDomaine("Acquisition & Données externes"), rmDomaine("Historisation & Volumétrie"), rmDomaine("Architecture & Règles de gestion")]},
    {nom: "Dashboard / Vues Métiers", domaines: [
      rmDomaine("Page : Accueil"), rmDomaine("Page : Accès / Présence en emploi"), rmDomaine("Page : Description des publics"),
      rmDomaine("Page : Entrants en formation"), rmDomaine("Page : Fiches action"), rmDomaine("Page : Satisfaction DE"),
      rmDomaine("Page : Sortants de formation"), rmDomaine("Page : Taux / Délai de pourvoi"), rmDomaine("Page : Taux de recours"),
      rmDomaine("Page : Analyse par public"), rmDomaine("Cas d'usage formation")
    ]},
    {nom: "Ressources documentaires", domaines: [rmDomaine("Glossaire"), rmDomaine("Communication")]},
    {nom: "Administration & Sécurité", domaines: [rmDomaine("Gestion des habilitations")]}
  ]
};

var roadmapData = null;
var roadmapLoaded = false;

function rmParseDMY(s){
  var m = /^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})$/.exec((s || '').trim());
  if (!m) return null;
  var y = m[3].length === 2 ? '20' + m[3] : m[3];
  var d = new Date(parseInt(y,10), parseInt(m[2],10) - 1, parseInt(m[1],10));
  return isNaN(d.getTime()) ? null : d;
}

function renderRoadmapLegend(){
  document.getElementById('roadmapLegend').innerHTML = ROADMAP_TYPOLOGIES.map(function(t){
    return '<div class="roadmap-legend-item"><span class="roadmap-legend-dot" style="background:' + ROADMAP_COLORS[t] + '"></span>' + escapeHtml(t) + '</div>';
  }).join('');
}

var roadmapRange = null; // plage fixe M-12 a M+12, calculee a chaque ouverture / changement de fenetre
var roadmapWindowSize = 6; // 6 ou 12 mois visibles simultanement, occupant toute la largeur
var roadmapCurrentPanPx = 0;

function rmAvailableWidth(){
  var ref = document.getElementById('roadmapBody');
  return Math.max(320, (ref ? ref.clientWidth : 900) - 48);
}

function rmComputeRange(){
  var today = new Date();
  today.setHours(0,0,0,0);
  var minD = new Date(today.getFullYear(), today.getMonth() - 12, 1);
  var maxD = new Date(today.getFullYear(), today.getMonth() + 13, 0); // dernier jour du mois M+12
  var moisAbbr = ['Janv','Févr','Mars','Avr','Mai','Juin','Juil','Août','Sept','Oct','Nov','Déc'];
  var monthLabels = [];
  var monthDates = [];
  var monthDays = [];
  var currentIdx = 12;
  var cur = new Date(minD.getFullYear(), minD.getMonth(), 1);
  var idx = 0;
  while (cur <= maxD) {
    var next = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
    var daysInMonth = Math.round((Math.min(next, new Date(maxD.getTime() + 86400000)) - cur) / 86400000);
    monthLabels.push(moisAbbr[cur.getMonth()] + ' ' + cur.getFullYear());
    monthDates.push(new Date(cur));
    monthDays.push(daysInMonth);
    if (cur.getFullYear() === today.getFullYear() && cur.getMonth() === today.getMonth()) currentIdx = idx;
    idx++;
    cur = next;
  }
  // pxPerDay dynamique : la fenetre affichee (roadmapWindowSize mois) doit occuper toute la largeur disponible
  var daysInWindow = monthDays.slice(currentIdx, currentIdx + roadmapWindowSize).reduce(function(a, b){ return a + b; }, 0) || (roadmapWindowSize * 30);
  var pxPerDay = rmAvailableWidth() / daysInWindow;
  var monthStarts = [];
  var acc = 0;
  monthDays.forEach(function(d){ monthStarts.push(Math.round(acc)); acc += d * pxPerDay; });
  var totalWidth = Math.round(acc);
  var maxIdx = Math.max(0, monthLabels.length - roadmapWindowSize);
  return {
    today: today, minD: minD, maxD: maxD, pxPerDay: pxPerDay, totalWidth: totalWidth,
    monthStarts: monthStarts, monthDays: monthDays, monthDates: monthDates, monthLabels: monthLabels,
    currentIdx: Math.min(currentIdx, maxIdx), maxIdx: maxIdx,
    todayOffsetPx: Math.round((today - minD) / 86400000) * pxPerDay
  };
}

function renderTimelineForDomaine(taches){
  var withDates = taches.filter(function(t){ return rmParseDMY(t.dateDebut); });
  if (!withDates.length) return '<div class="rm-no-date">Aucune date renseignée pour ces travaux.</div>';

  var r = roadmapRange;
  var monthLinesHtml = r.monthStarts.map(function(px){
    return '<div class="rm-month-line" style="left:' + px + 'px"></div>';
  }).join('');

  var rowsHtml = withDates.map(function(t){
    var start = rmParseDMY(t.dateDebut);
    var end = rmParseDMY(t.dateFin);
    var openEnded = !end;
    var segStart = start < r.minD ? r.minD : start;
    var segEnd = end && end < r.maxD ? end : r.maxD;
    var left = Math.round((segStart - r.minD) / 86400000 * r.pxPerDay);
    var width = Math.max(24, Math.round((segEnd - segStart) / 86400000 * r.pxPerDay) + Math.round(r.pxPerDay));
    var color = ROADMAP_COLORS[t.typologie] || 'var(--ft-indigo)';
    var titre = t.titre || t.typologie || 'Tâche';
    var popupData = {titre: titre, typologie: t.typologie || '', texte: t.texte || '', debut: t.dateDebut || '', fin: t.dateFin || '', maj: t.derniereMaj || ''};
    return '<div class="rm-timeline-row"><div class="rm-bar' + (openEnded ? ' rm-bar--open' : '') + '" style="left:' + left + 'px;width:' + width + 'px;background:' + color + '" data-rm-task="' + escapeHtml(JSON.stringify(popupData)) + '" data-rm-bar-left="' + left + '" data-rm-bar-width="' + width + '">' +
      '<span class="rm-bar-label">' + escapeHtml(titre.slice(0, 60)) + '</span>' +
    '</div></div>';
  }).join('');

  return '<div class="rm-timeline-scroll"><div class="rm-timeline-inner" data-rm-inner style="width:' + r.totalWidth + 'px">' +
    '<div class="rm-timeline-today-line" style="left:' + r.todayOffsetPx + 'px"></div>' +
    '<div class="rm-timeline-rows">' + monthLinesHtml + rowsHtml + '</div>' +
  '</div></div>';
}

/* Navigation temporelle unique : cases mois/annee (etiquettes de la fenetre visible) + curseur en dessous */
function renderRoadmapNav(){
  var r = roadmapRange;
  var nav = document.getElementById('roadmapNav');
  nav.innerHTML =
    '<div class="rm-nav-row">' +
      '<button type="button" class="rm-nav-arrow" id="roadmapNavPrev" aria-label="Mois précédent">‹</button>' +
      '<div class="rm-nav-months" id="rmNavMonths"></div>' +
      '<button type="button" class="rm-nav-arrow" id="roadmapNavNext" aria-label="Mois suivant">›</button>' +
    '</div>' +
    '<div class="rm-nav-toggle-row">' +
      '<button type="button" class="btn btn--secondary btn--sm" id="roadmapWindowToggle">Vue ' + (roadmapWindowSize === 6 ? '12 mois' : '6 mois') + '</button>' +
    '</div>';

  var currentStart = r.currentIdx;

  function renderMonthBoxes(idx){
    var boxesHtml = '';
    for (var i = 0; i < roadmapWindowSize; i++) {
      var mIdx = idx + i;
      if (mIdx >= r.monthLabels.length) break;
      boxesHtml += '<div class="rm-nav-month-box' + (mIdx === r.currentIdx ? ' rm-nav-month-box--today' : '') + '">' + r.monthLabels[mIdx] + '</div>';
    }
    document.getElementById('rmNavMonths').innerHTML = boxesHtml;
    document.getElementById('roadmapNavPrev').disabled = idx <= 0;
    document.getElementById('roadmapNavNext').disabled = idx >= r.maxIdx;
  }
  function goToIndex(idx){
    currentStart = Math.max(0, Math.min(idx, r.maxIdx));
    renderMonthBoxes(currentStart);
    applyRoadmapScroll(r.monthStarts[currentStart]);
    updateRoadmapCounters();
  }
  roadmapStepMonth = function(delta){ goToIndex(currentStart + delta); };
  document.getElementById('roadmapNavPrev').addEventListener('click', function(){ goToIndex(currentStart - 1); });
  document.getElementById('roadmapNavNext').addEventListener('click', function(){ goToIndex(currentStart + 1); });
  document.getElementById('roadmapWindowToggle').addEventListener('click', function(){
    roadmapWindowSize = roadmapWindowSize === 6 ? 12 : 6;
    renderRoadmapBody();
  });
  goToIndex(r.currentIdx);
}

function applyRoadmapScroll(px){
  roadmapCurrentPanPx = px;
  document.querySelectorAll('[data-rm-inner]').forEach(function(el){ el.style.transform = 'translateX(-' + px + 'px)'; });
  updateBarLabelPositions();
}

/* Le titre d'une tache reste lisible : il se cale sur le bord visible de la fenetre,
   sans jamais depasser la fin de la barre. */
function updateBarLabelPositions(){
  document.querySelectorAll('.rm-timeline-scroll').forEach(function(scrollEl){
    var viewportWidth = scrollEl.clientWidth;
    scrollEl.querySelectorAll('.rm-bar').forEach(function(bar){
      var barLeft = parseFloat(bar.dataset.rmBarLeft) || 0;
      var barWidth = parseFloat(bar.dataset.rmBarWidth) || 0;
      var label = bar.querySelector('.rm-bar-label');
      if (!label) return;
      var visLeft = barLeft - roadmapCurrentPanPx;
      var visRight = visLeft + barWidth;
      if (visRight <= 0 || visLeft >= viewportWidth) return; // barre hors champ, inutile de calculer
      var clampLeft = Math.max(visLeft, 0);
      var offsetWithinBar = clampLeft - visLeft;
      var maxOffset = Math.max(0, barWidth - (label.offsetWidth || 40) - 10);
      offsetWithinBar = Math.min(offsetWithinBar, maxOffset);
      label.style.transform = offsetWithinBar > 0 ? ('translateX(' + offsetWithinBar + 'px)') : '';
    });
  });
}

/* Fenetre actuellement affichee a l'ecran (roadmapWindowSize mois, ancree sur la position du curseur) */
function currentVisibleWindow(){
  var r = roadmapRange;
  var slider = document.getElementById('roadmapNavSlider');
  var idx = slider ? parseInt(slider.value, 10) : r.currentIdx;
  var visStart = r.monthDates[idx];
  var endIdx = idx + roadmapWindowSize;
  var visEnd = endIdx < r.monthDates.length ? r.monthDates[endIdx] : new Date(r.maxD.getTime() + 86400000);
  return {start: visStart, end: visEnd};
}
function taskOverlapsWindow(t, visStart, visEnd){
  var start = rmParseDMY(t.dateDebut);
  if (!start) return false;
  var end = rmParseDMY(t.dateFin) || roadmapRange.maxD;
  return start < visEnd && end >= visStart;
}
/* Filtre "travaux en cours sur la periode affichee" + compteur actifs/total par domaine */
function updateRoadmapCounters(){
  var win = currentVisibleWindow();
  var filterOn = document.getElementById('roadmapFilterActive').checked;
  var epics = (roadmapData && roadmapData.epics) || [];
  epics.forEach(function(epic, ei){
    var epicHasActive = false;
    (epic.domaines || []).forEach(function(dom, di){
      var taches = dom.taches || [];
      var activeCount = taches.filter(function(t){ return taskOverlapsWindow(t, win.start, win.end); }).length;
      if (activeCount > 0) epicHasActive = true;
      var domEl = document.querySelector('[data-rm-domaine="' + ei + '-' + di + '"]');
      if (!domEl) return;
      var countEl = domEl.querySelector('.rm-domaine-count');
      if (countEl) {
        countEl.textContent = activeCount + ' actif' + (activeCount > 1 ? 's' : '') + ' sur la période / ' + taches.length + ' au total';
        countEl.classList.toggle('rm-count-active', activeCount > 0);
      }
      domEl.style.display = (filterOn && activeCount === 0) ? 'none' : '';
    });
    var epicEl = document.querySelector('[data-rm-epic="' + ei + '"]');
    if (epicEl) epicEl.style.display = (filterOn && !epicHasActive) ? 'none' : '';
  });
}

function renderRoadmapBody(){
  roadmapRange = rmComputeRange();
  renderRoadmapNav();
  var epics = (roadmapData && roadmapData.epics) || [];
  // Par defaut : seuls les Epic > Domaine comportant au moins une tache datee (historique) sont affiches
  var html = epics.map(function(epic, ei){
    var domainesAvecHistorique = (epic.domaines || []).filter(function(dom){
      return (dom.taches || []).some(function(t){ return rmParseDMY(t.dateDebut); });
    });
    if (!domainesAvecHistorique.length) return '';
    var domainesHtml = (epic.domaines || []).map(function(dom, di){
      if (!(dom.taches || []).some(function(t){ return rmParseDMY(t.dateDebut); })) return '';
      return '<div class="rm-domaine" data-rm-domaine="' + ei + '-' + di + '">' +
        '<div class="rm-domaine-head"><span class="rm-toggle">▾</span>' + escapeHtml(dom.nom) + ' <span class="rm-domaine-count"></span></div>' +
        '<div class="rm-domaine-body">' + renderTimelineForDomaine(dom.taches || []) + '</div>' +
      '</div>';
    }).join('');
    return '<div class="rm-epic" data-rm-epic="' + ei + '">' +
      '<div class="rm-epic-head"><span class="rm-toggle">▾</span>' + escapeHtml(epic.nom) + '</div>' +
      '<div class="rm-epic-body">' + domainesHtml + '</div>' +
    '</div>';
  }).join('');
  document.getElementById('roadmapBody').innerHTML = html || '<div class="empty-hint">Aucun élément avec une date renseignée pour le moment.</div>';
  bindRoadmapInteractions();
  applyRoadmapScroll(roadmapRange.monthStarts[roadmapRange.currentIdx]);
  updateRoadmapCounters();
}

function bindRoadmapInteractions(){
  document.querySelectorAll('.rm-epic-head').forEach(function(head){
    head.addEventListener('click', function(){ head.closest('.rm-epic').classList.toggle('collapsed'); });
  });
  document.querySelectorAll('.rm-domaine-head').forEach(function(head){
    head.addEventListener('click', function(){
      head.closest('.rm-domaine').classList.toggle('collapsed');
      applyRoadmapScroll(roadmapCurrentPanPx);
    });
  });
  document.querySelectorAll('[data-rm-task]').forEach(function(bar){
    bar.addEventListener('mouseenter', function(){
      var d;
      try { d = JSON.parse(bar.getAttribute('data-rm-task')); } catch(e){ return; }
      var popup = document.getElementById('rmTaskPopup');
      var periodeTxt = d.debut ? ('Du ' + d.debut + ' ' + (d.fin ? 'au ' + d.fin : '(en continu)')) : '';
      popup.innerHTML = '<h5>' + escapeHtml(d.titre) + '</h5>' +
        (d.maj ? '<div class="rm-task-updated">Dernière mise à jour : ' + escapeHtml(d.maj) + '</div>' : '') +
        (d.texte ? '<div>' + richText(d.texte) + '</div>' : '') +
        (periodeTxt ? '<div class="rm-task-dates">' + escapeHtml(periodeTxt) + '</div>' : '');
      popup.classList.add('open');
      var rect = bar.getBoundingClientRect();
      var margin = 10;
      var pw = popup.offsetWidth;
      var ph = popup.offsetHeight;
      var left = rect.left;
      if (left + pw > window.innerWidth - margin) left = window.innerWidth - pw - margin;
      if (left < margin) left = margin;
      var top = rect.bottom + 8;
      if (top + ph > window.innerHeight - margin) top = rect.top - ph - 8;
      if (top < margin) top = margin;
      popup.style.left = left + 'px';
      popup.style.top = top + 'px';
    });
    bar.addEventListener('mouseleave', function(){ document.getElementById('rmTaskPopup').classList.remove('open'); });
  });
}

function openRoadmap(){
  document.getElementById('roadmapOverlay').classList.add('open');
  renderRoadmapLegend();
  if (roadmapLoaded) { renderRoadmapBody(); return; }
  db.collection('site_content').doc('roadmap').get().then(function(doc){
    roadmapData = (doc.exists && doc.data() && doc.data().data) ? doc.data().data : DEFAULT_ROADMAP;
    roadmapLoaded = true;
    renderRoadmapBody();
  }).catch(function(){
    roadmapData = DEFAULT_ROADMAP;
    roadmapLoaded = true;
    renderRoadmapBody();
  });
}
function closeRoadmap(){
  document.getElementById('roadmapOverlay').classList.remove('open');
  document.getElementById('rmTaskPopup').classList.remove('open');
}
document.getElementById('roadmapClose').addEventListener('click', closeRoadmap);

/* Navigation tactile mobile : glisser horizontalement sur la page fait avancer/reculer d'un mois.
   Ne se declenche que pour un geste nettement horizontal, pour ne jamais gener le defilement
   vertical normal du corps de la roadmap ni les taps sur les boutons/barres/liens. */
var roadmapStepMonth = null;
(function(){
  var touchStartX = 0, touchStartY = 0, touchHandled = false;
  var SWIPE_THRESHOLD = 55;
  var overlay = document.getElementById('roadmapOverlay');
  overlay.addEventListener('touchstart', function(ev){
    if (ev.touches.length !== 1) return;
    touchStartX = ev.touches[0].clientX;
    touchStartY = ev.touches[0].clientY;
    touchHandled = false;
  }, {passive: true});
  overlay.addEventListener('touchend', function(ev){
    if (touchHandled || !roadmapStepMonth) return;
    var dx = ev.changedTouches[0].clientX - touchStartX;
    var dy = ev.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > SWIPE_THRESHOLD) {
      touchHandled = true;
      roadmapStepMonth(dx < 0 ? 1 : -1);
    }
  }, {passive: true});
})();
document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape') closeRoadmap(); });
document.getElementById('roadmapFilterActive').addEventListener('change', updateRoadmapCounters);

function exportRoadmapPdf(){
  if (typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined') {
    alert("Le module d'export PDF n'a pas pu se charger. Vérifiez votre connexion et réessayez.");
    return;
  }
  var btn = document.getElementById('roadmapExportPdf');
  var filterCheckbox = document.getElementById('roadmapFilterActive');
  var wasFilterOn = filterCheckbox.checked;
  var collapsedEpics = Array.prototype.slice.call(document.querySelectorAll('.rm-epic.collapsed'));
  var collapsedDomaines = Array.prototype.slice.call(document.querySelectorAll('.rm-domaine.collapsed'));

  btn.disabled = true;
  btn.textContent = '⏳ Génération du PDF...';
  filterCheckbox.checked = true;
  updateRoadmapCounters();
  collapsedEpics.forEach(function(el){ el.classList.remove('collapsed'); });
  collapsedDomaines.forEach(function(el){ el.classList.remove('collapsed'); });

  setTimeout(function(){
    html2canvas(document.getElementById('roadmapBody'), {scale: 2, backgroundColor: '#ffffff'}).then(function(canvas){
      var jsPDF = window.jspdf.jsPDF;
      var pdf = new jsPDF({orientation: 'landscape', unit: 'pt', format: 'a4'});
      var pageWidth = pdf.internal.pageSize.getWidth();
      var pageHeight = pdf.internal.pageSize.getHeight();
      var imgWidth = pageWidth;
      var imgHeight = canvas.height * imgWidth / canvas.width;
      var heightLeft = imgHeight;
      var position = 0;
      var imgData = canvas.toDataURL('image/png');
      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
      while (heightLeft > 0) {
        position = heightLeft - imgHeight;
        pdf.addPage();
        pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;
      }
      pdf.save('roadmap-rpe-' + new Date().toISOString().slice(0, 10) + '.pdf');
    }).catch(function(){
      alert("Une erreur est survenue pendant la génération du PDF.");
    }).finally(function(){
      filterCheckbox.checked = wasFilterOn;
      collapsedEpics.forEach(function(el){ el.classList.add('collapsed'); });
      collapsedDomaines.forEach(function(el){ el.classList.add('collapsed'); });
      updateRoadmapCounters();
      btn.disabled = false;
      btn.textContent = '📄 Exporter en PDF (paysage)';
    });
  }, 50);
}
document.getElementById('roadmapExportPdf').addEventListener('click', exportRoadmapPdf);

(function(){
  var popup = document.createElement('div');
  popup.id = 'rmTaskPopup';
  popup.className = 'rm-task-popup';
  document.body.appendChild(popup);
})();

db.collection('site_content').doc('homepage').get().then(function(doc){
  var content = (doc.exists && doc.data() && doc.data().data) ? doc.data().data : DEFAULT_CONTENT;
  renderPage(content);
}).catch(function(){
  renderPage(DEFAULT_CONTENT);
});

});
