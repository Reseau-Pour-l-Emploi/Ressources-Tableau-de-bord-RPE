function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function renderLiens(liens){
  if (!liens || !liens.length) return '';
  return '<div class="item-liens">' + liens.filter(function(l){ return l.url; }).map(function(l){
    return '<a href="' + escapeHtml(l.url) + '" target="_blank" rel="noopener">' + escapeHtml(l.label) + ' →</a>';
  }).join('') + '</div>';
}

function renderItemList(items){
  if (!items || !items.length) return '<div class="empty-hint">Rien à afficher pour le moment.</div>';
  return items.map(function(it){
    var head = '<div class="item-head"><span class="item-titre">' + escapeHtml(it.titre || '') + '</span>' +
      (it.date ? '<span class="item-date">' + escapeHtml(it.date) + '</span>' : '') + '</div>';
    var desc = it.description ? '<div class="item-desc">' + escapeHtml(it.description) + '</div>' : '';
    return '<div class="item-row">' + head + desc + renderLiens(it.liens) + '</div>';
  }).join('');
}

function renderPage(content){
  var c = content;
  document.getElementById('navCta').href = c.tdb_url || DEFAULT_CONTENT.tdb_url;

  var html = '';

  html += '<div class="hero"><h2>Bienvenue sur les ressources du Tableau de bord RPE</h2>';
  html += '<p>' + escapeHtml(c.intro && c.intro.texte || '') + '</p>';
  html += '<a class="hero-cta" href="' + escapeHtml(c.tdb_url || '') + '" target="_blank" rel="noopener">Accéder au Tableau de Bord RPE →</a>';
  html += '<div class="hero-links">';
  (c.intro && c.intro.videos || []).forEach(function(v){
    html += '<div class="hero-link-card"><div class="cat">🎬 Vidéo</div><a href="' + escapeHtml(v.url) + '" target="_blank" rel="noopener">' + escapeHtml(v.titre) + '</a></div>';
  });
  (c.intro && c.intro.textes || []).forEach(function(t){
    html += '<div class="hero-link-card"><div class="cat">⚖ Texte réglementaire</div><a href="' + escapeHtml(t.url) + '" target="_blank" rel="noopener">' + escapeHtml(t.titre) + '</a></div>';
  });
  html += '</div></div>';

  // 2. Agenda
  html += '<div class="section"><h3>🗓️ Agenda</h3>' + renderItemList(c.agenda) + '</div>';

  // 3. Actualités
  html += '<div class="section"><h3>📢 Actualités</h3>' + renderItemList(c.actualites) + '</div>';

  // 4. Newsletters
  html += '<div class="section"><h3>✉️ Newsletters</h3>' + renderItemList(c.newsletters) + '</div>';

  // 5. Webinaires
  html += '<div class="section"><h3>🎬 Webinaires</h3>' + renderItemList(c.webinaires) + '</div>';

  // 6. Ressources complémentaires
  html += '<div class="section"><h3>📚 Ressources complémentaires</h3>' + renderItemList(c.ressources) + '</div>';

  // 7. Contact
  var contact = c.contact || {};
  html += '<div class="section"><h3>💬 Contact &amp; assistance</h3>';
  html += '<p>' + escapeHtml(contact.texte || '') + '</p>';
  if (contact.booking_url) {
    html += '<a class="contact-cta" href="' + escapeHtml(contact.booking_url) + '" target="_blank" rel="noopener">Réservez un créneau de ⏱ 15\' pour parler du tableau de bord RPE</a>';
  }
  if (contact.consignes_erreur || contact.email_support) {
    html += '<div class="contact-note">' + escapeHtml(contact.consignes_erreur || '') +
      (contact.email_support ? ' <a href="mailto:' + escapeHtml(contact.email_support) + '">' + escapeHtml(contact.email_support) + '</a>' : '') + '</div>';
  }
  html += '</div>';

  // Footer tools
  if (c.footer_liens && c.footer_liens.length) {
    html += '<div class="footer-tools"><h3>Autres outils du Réseau Pour l\'Emploi</h3><ul>';
    c.footer_liens.forEach(function(l){
      html += '<li><a href="' + escapeHtml(l.url) + '" target="_blank" rel="noopener">' + escapeHtml(l.titre) + '</a></li>';
    });
    html += '</ul></div>';
  }

  document.getElementById('mainContent').innerHTML = html;
}

db.collection('site_content').doc('homepage').get().then(function(doc){
  var content = (doc.exists && doc.data() && doc.data().data) ? doc.data().data : DEFAULT_CONTENT;
  renderPage(content);
}).catch(function(){
  renderPage(DEFAULT_CONTENT);
});

});
</script>
</body>
