<style>
@font-face{font-family:'Marianne';src:url('fonts/Marianne-Light.woff2') format('woff2');font-weight:300;font-display:swap}
@font-face{font-family:'Marianne';src:url('fonts/Marianne-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Marianne';src:url('fonts/Marianne-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Marianne';src:url('fonts/Marianne-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
:root{
  --ft-navy:#0D1440; --ft-indigo:#293378; --ft-indigo-dark:#1C2456; --ft-indigo-light:#E3E5F1;
  --ft-violet:#7E58A0; --ft-violet-light:#ECE6F2;
  --ft-jaune:#FFCC52; --ft-jaune-dark:#E0A800; --ft-jaune-light:#FFF4D6;
  --ft-bleu:#406BDE; --ft-bleu-light:#E2E8FB;
  --ft-orange:#D96B00; --ft-orange-light:#FCEADB;
  --ft-rouge:#D92424; --ft-bordeaux:#5C0F38; --ft-bordeaux-light:#EFDCE6;
  --ft-sable:#F5F2EE; --ft-sable-dark:#E6E1DB;
  --ft-gray-200:#E5E7EB; --ft-gray-300:#D1D5DB; --ft-gray-400:#9CA3AF; --ft-gray-500:#6B7280; --ft-gray-700:#374151;
  --ft-white:#FFFFFF;
  --ft-fg-1:var(--ft-navy); --ft-fg-2:var(--ft-gray-700); --ft-fg-3:var(--ft-gray-500);
  --ft-border:var(--ft-gray-200);
  --ft-font:'Marianne',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  --sh-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh-md:0 4px 10px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--ft-font);font-size:14px;line-height:1.6;color:var(--ft-fg-1);background:var(--ft-sable)}
a{color:var(--ft-indigo)}
header.site{background:var(--ft-white);border-bottom:1px solid var(--ft-border);position:sticky;top:0;z-index:1100}
.site-inner{max-width:1500px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.site-inner img{height:42px}
.site-title{flex:1}
.site-title h1{font-size:18px;font-weight:700;margin:0;line-height:1.25}
.admin-link{font-size:12px;font-weight:600;color:var(--ft-indigo);text-decoration:none;border:1px solid var(--ft-indigo);border-radius:4px;padding:6px 12px;white-space:nowrap}
.admin-link:hover{background:var(--ft-indigo-light)}
.site-nav{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.nav-link{font-size:14px;font-weight:600;color:var(--ft-fg-2);text-decoration:none;padding:6px 2px;border-bottom:2px solid transparent}
.nav-link:hover{color:var(--ft-indigo)}
.nav-link.active{color:var(--ft-indigo);border-bottom-color:var(--ft-indigo)}
.nav-cta{font-size:13px;font-weight:700;color:#fff;background:var(--ft-indigo);text-decoration:none;padding:9px 16px;border-radius:999px;white-space:nowrap}
.nav-cta:hover{background:var(--ft-indigo-dark)}
main{max-width:1360px;margin:0 auto;padding:0 24px 56px}
footer.site{border-top:1px solid var(--ft-border);background:var(--ft-white);margin-top:24px}
footer.site .inner{max-width:1500px;margin:0 auto;padding:16px 24px;font-size:12px;color:var(--ft-fg-3);display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:center}
.footer-icon{height:28px;width:auto;flex:none}
.footer-title{font-weight:700;color:var(--ft-fg-1);font-size:13px;white-space:nowrap}
.footer-ft-logo{height:34px;width:auto;flex:none}

/* ==== Hero / intro (pleine largeur, 2 colonnes) ==== */
.hero-band{background:linear-gradient(135deg,var(--ft-navy),var(--ft-indigo));color:#fff}
.hero{max-width:1360px;margin:0 auto;padding:40px 24px;display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:center}
@media (max-width:900px){.hero{grid-template-columns:1fr;padding:28px 24px}}
.hero h2{margin:0 0 12px;font-size:26px;line-height:1.25}
.hero p{margin:0 0 20px;font-size:14.5px;color:#E3E5F1;max-width:60ch}
.hero .hero-cta{display:inline-block;background:var(--ft-jaune);color:var(--ft-navy);font-weight:700;text-decoration:none;padding:13px 24px;border-radius:999px;font-size:14.5px}
.hero .hero-cta:hover{background:var(--ft-jaune-dark)}
.hero-links{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.hero-links{grid-template-columns:1fr}}
.hero-link-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:14px 16px;transition:background .15s}
.hero-link-card:hover{background:rgba(255,255,255,.16)}
.hero-link-card a{color:#fff;font-weight:600;text-decoration:none;display:block;font-size:13px}
.hero-link-card .cat{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#B9C0E8;margin-bottom:6px}

/* ==== Grille principale : contenu + colonne laterale flottante ==== */
.page-grid{display:grid;grid-template-columns:1fr 340px;gap:24px;margin-top:28px;align-items:start}
@media (max-width:960px){.page-grid{grid-template-columns:1fr}}
.main-col{min-width:0}
.side-col{position:sticky;top:74px;display:flex;flex-direction:column;gap:20px}
@media (max-width:960px){.side-col{position:static}}

/* ==== Sections generiques ==== */
.section{background:var(--ft-white);border:1px solid var(--ft-border);border-radius:10px;padding:22px 24px;margin-bottom:22px;box-shadow:var(--sh-sm)}
.section h3{margin:0 0 16px;font-size:16px;display:flex;align-items:center;gap:8px}
.item-row{border:1px solid var(--ft-border);border-radius:6px;padding:12px 14px;margin-bottom:10px;background:var(--ft-sable)}
.item-row:last-child{margin-bottom:0}
.item-row .item-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.item-row .item-titre{font-weight:700;font-size:13.5px}
.item-row .item-date{font-size:11px;color:var(--ft-fg-3);white-space:nowrap}
.item-row .item-desc{font-size:12.5px;color:var(--ft-fg-2);margin-top:4px}
.item-row .item-liens{margin-top:8px;display:flex;gap:14px;flex-wrap:wrap}
.item-row .item-liens a{font-size:12.5px;font-weight:600;text-decoration:none}
.item-row .item-liens a:hover{text-decoration:underline}
.empty-hint{color:var(--ft-fg-3);font-style:italic;font-size:12.5px}
.show-more-btn{display:block;margin:14px auto 0;background:none;border:1px solid var(--ft-indigo);color:var(--ft-indigo);font-weight:700;font-size:12.5px;padding:8px 18px;border-radius:999px;cursor:pointer;font-family:inherit}
.show-more-btn:hover{background:var(--ft-indigo-light)}
.hidden-item{display:none}

/* ==== Sidebar : agenda compact ==== */
.agenda-card{background:var(--ft-white);border:1px solid var(--ft-border);border-radius:10px;padding:18px 20px;box-shadow:var(--sh-sm)}
.agenda-card h3{margin:0 0 12px;font-size:14.5px;display:flex;align-items:center;gap:8px}
.agenda-item{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--ft-border)}
.agenda-item:last-child{border-bottom:none;padding-bottom:0}
.agenda-date{flex:none;width:52px;text-align:center;background:var(--ft-indigo-light);color:var(--ft-indigo);border-radius:6px;padding:5px 2px;font-size:10.5px;font-weight:700;line-height:1.3}
.agenda-body .item-titre{display:block;font-weight:700;font-size:12.5px}
.agenda-body .item-desc{font-size:11.5px;color:var(--ft-fg-3);margin-top:2px}
.agenda-body .item-liens{margin-top:4px}
.agenda-body .item-liens a{font-size:11.5px}

/* ==== Sidebar : contact flottant ==== */
.contact-card{background:linear-gradient(160deg,var(--ft-indigo),var(--ft-navy));color:#fff;border-radius:10px;padding:20px}
.contact-card h3{margin:0 0 10px;font-size:14.5px}
.contact-card p{font-size:12.5px;color:#DDE1F5;margin:0 0 14px}
.contact-cta{display:block;text-align:center;background:var(--ft-jaune);color:var(--ft-navy);font-weight:700;text-decoration:none;padding:11px 16px;border-radius:999px;font-size:12.5px}
.contact-cta:hover{background:var(--ft-jaune-dark)}
.contact-note{background:rgba(255,255,255,.1);border-radius:6px;padding:10px 12px;font-size:11.5px;margin-top:14px;color:#E3E5F1}
.contact-note a{color:#fff}

/* ==== Actualites : bandeaux colores ==== */
.actu-item{display:flex;gap:12px;align-items:flex-start;border-radius:8px;padding:13px 16px;margin-bottom:10px;border-left:4px solid var(--ft-bleu)}
.actu-item:last-child{margin-bottom:0}
.actu-item.actu-alerte{background:var(--ft-orange-light);border-left-color:var(--ft-orange)}
.actu-item.actu-info{background:var(--ft-bleu-light);border-left-color:var(--ft-bleu)}
.actu-icon{font-size:18px;flex:none}
.actu-item .item-titre{font-size:13.5px}
.actu-item .item-desc{font-size:12.5px;margin-top:3px}

/* ==== Webinaires : grille de cartes type carrousel ==== */
.webinar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.webinar-card{border:1px solid var(--ft-border);border-radius:8px;padding:14px 16px;background:var(--ft-sable);display:flex;flex-direction:column}
.webinar-card .item-date{display:inline-block;background:var(--ft-violet-light);color:var(--ft-violet);font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;margin-bottom:8px;width:fit-content}
.webinar-card .item-titre{font-size:13px;display:block;margin-bottom:auto}
.webinar-card .item-liens{margin-top:10px}

/* ==== Ressources : rangee horizontale defilante ==== */
.res-scroll{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.res-scroll::-webkit-scrollbar{height:6px}
.res-scroll::-webkit-scrollbar-thumb{background:var(--ft-gray-300);border-radius:3px}
.res-card{flex:0 0 240px;scroll-snap-align:start;border:1px solid var(--ft-border);border-radius:8px;padding:16px;background:var(--ft-sable)}
.res-card .item-titre{font-size:13px;display:block;margin-bottom:8px}

.footer-tools{background:var(--ft-indigo-light);border-radius:10px;padding:20px 24px;margin-top:4px}
.footer-tools h3{margin:0 0 14px;font-size:14.5px}
.footer-tools-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.footer-tools-grid a{display:block;background:#fff;border-radius:8px;padding:14px 16px;font-size:13px;font-weight:600;text-decoration:none;box-shadow:var(--sh-sm)}
.footer-tools-grid a:hover{box-shadow:var(--sh-md)}
/* ==== Responsive mobile / tablette ==== */
@media (max-width:760px){
  .site-inner{padding:10px 14px;gap:10px}
  .site-inner img{height:34px}
  .site-title h1{font-size:15px}
  .site-nav{gap:10px}
  .nav-link{font-size:12.5px}
  .nav-cta{font-size:12px;padding:8px 12px}
  .admin-link{font-size:11px;padding:5px 9px}
  main{padding:0 14px 40px}
  .hero{padding:24px 16px}
  .hero h2{font-size:20px}
  .section{padding:16px 16px}
  .webinar-grid{grid-template-columns:1fr 1fr}
  .res-card{flex:0 0 200px}
}
@media (max-width:480px){
  .webinar-grid{grid-template-columns:1fr}
}
</style>
</head>

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function renderLiens(liens){
  if (!liens || !liens.length) return '';
  return '<div class="item-liens">' + liens.filter(function(l){ return l.url; }).map(function(l){
    return '<a href="' + escapeHtml(l.url) + '" target="_blank" rel="noopener">' + escapeHtml(l.label) + ' →</a>';
  }).join('') + '</div>';
}

var MOIS_ABBR = ['JANV','FÉVR','MARS','AVR','MAI','JUIN','JUIL','AOÛT','SEPT','OCT','NOV','DÉC'];
function parseCalendarDate(dateStr){
  if (!dateStr) return null;
  var m = /^(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})$/.exec(dateStr.trim());
  if (!m) return null;
  var jour = parseInt(m[1], 10), mois = parseInt(m[2], 10);
  if (!jour || !mois || mois < 1 || mois > 12) return null;
  return {jour: jour, mois: MOIS_ABBR[mois - 1]};
}

/* liste generique (utilisee pour actualites/newsletters, style neutre) */
function renderItemList(items, sectionId, limit){
  if (!items || !items.length) return '<div class="empty-hint">Rien à afficher pour le moment.</div>';
  var rows = items.map(function(it, idx){
    var hidden = (limit && idx >= limit) ? ' hidden-item' : '';
    var head = '<div class="item-head"><span class="item-titre">' + escapeHtml(it.titre || '') + '</span>' +
      (it.date ? '<span class="item-date">' + escapeHtml(it.date) + '</span>' : '') + '</div>';
    var desc = it.description ? '<div class="item-desc">' + escapeHtml(it.description) + '</div>' : '';
    return '<div class="item-row' + hidden + '" data-idx="' + idx + '">' + head + desc + renderLiens(it.liens) + '</div>';
  }).join('');
  return rows + showMoreButton(items.length, limit, sectionId);
}

function showMoreButton(total, limit, sectionId){
  if (!limit || total <= limit) return '';
  return '<button type="button" class="show-more-btn" data-showmore="' + sectionId + '">Afficher plus (' + (total - limit) + ')</button>';
}

function bindShowMore(container){
  container.querySelectorAll('[data-showmore]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var sectionId = btn.dataset.showmore;
      var scope = document.getElementById(sectionId);
      scope.querySelectorAll('.hidden-item').forEach(function(el){ el.classList.remove('hidden-item'); });
      btn.remove();
    });
  });
}

/* agenda : presentation calendrier (pastille jour/mois) */
function renderAgenda(items){
  if (!items || !items.length) return '<div class="empty-hint">Rien à afficher pour le moment.</div>';
  return items.map(function(it){
    var cal = parseCalendarDate(it.date);
    var dateBox = cal
      ? '<div class="agenda-date"><div style="font-size:15px">' + cal.jour + '</div>' + cal.mois + '</div>'
      : '<div class="agenda-date">🗓️</div>';
    var desc = it.description ? '<div class="item-desc">' + escapeHtml(it.description) + '</div>' : '';
    var dateLine = (!cal && it.date) ? '<div class="item-desc">' + escapeHtml(it.date) + '</div>' : '';
    return '<div class="agenda-item">' + dateBox +
      '<div class="agenda-body"><span class="item-titre">' + escapeHtml(it.titre || '') + '</span>' + dateLine + desc + renderLiens(it.liens) + '</div></div>';
  }).join('');
}

/* actualites : bandeaux colores selon mot-cle du titre */
function actuClass(titre){
  var t = (titre || '').toLowerCase();
  if (t.indexOf('anomalie') > -1 || t.indexOf('interruption') > -1 || t.indexOf('incident') > -1) return 'actu-alerte';
  return 'actu-info';
}
function actuIcon(titre){
  var t = (titre || '').toLowerCase();
  if (t.indexOf('anomalie') > -1) return '⚠️';
  if (t.indexOf('interruption') > -1) return '🛠️';
  if (t.indexOf('backlog') > -1) return '📋';
  return 'ℹ️';
}
function renderActualites(items){
  if (!items || !items.length) return '<div class="empty-hint">Rien à afficher pour le moment.</div>';
  return items.map(function(it){
    var desc = it.description ? '<div class="item-desc">' + escapeHtml(it.description) + '</div>' : '';
    return '<div class="actu-item ' + actuClass(it.titre) + '"><span class="actu-icon">' + actuIcon(it.titre) + '</span>' +
      '<div><span class="item-titre">' + escapeHtml(it.titre || '') + '</span>' +
      (it.date ? ' <span class="item-date">' + escapeHtml(it.date) + '</span>' : '') + desc + renderLiens(it.liens) + '</div></div>';
  }).join('');
}

/* webinaires : grille de cartes (limitee a 5 avant "afficher plus") */
function renderWebinaires(items, sectionId, limit){
  if (!items || !items.length) return '<div class="empty-hint">Rien à afficher pour le moment.</div>';
  var cards = items.map(function(it, idx){
    var hidden = (limit && idx >= limit) ? ' hidden-item' : '';
    return '<div class="webinar-card' + hidden + '">' +
      (it.date ? '<span class="item-date">' + escapeHtml(it.date) + '</span>' : '') +
      '<span class="item-titre">' + escapeHtml(it.titre || '') + '</span>' +
      renderLiens(it.liens) + '</div>';
  }).join('');
  return '<div class="webinar-grid">' + cards + '</div>' + showMoreButton(items.length, limit, sectionId);
}

/* ressources : rangee horizontale defilante (carrousel) */
function renderRessources(items){
  if (!items || !items.length) return '<div class="empty-hint">Rien à afficher pour le moment.</div>';
  return '<div class="res-scroll">' + items.map(function(it){
    return '<div class="res-card"><span class="item-titre">' + escapeHtml(it.titre || '') + '</span>' + renderLiens(it.liens) + '</div>';
  }).join('') + '</div>';
}

function renderPage(content){
  var c = content;
  document.getElementById('navCta').href = c.tdb_url || DEFAULT_CONTENT.tdb_url;

  // Hero (pleine largeur, hors grille)
  var hero = '<div class="hero-band"><div class="hero">';
  hero += '<div><h2>Bienvenue sur les ressources du Tableau de bord RPE</h2>';
  hero += '<p>' + escapeHtml(c.intro && c.intro.texte || '') + '</p>';
  hero += '<a class="hero-cta" href="' + escapeHtml(c.tdb_url || '') + '" target="_blank" rel="noopener">Accéder au Tableau de Bord RPE →</a></div>';
  hero += '<div class="hero-links">';
  (c.intro && c.intro.videos || []).forEach(function(v){
    hero += '<div class="hero-link-card"><div class="cat">🎬 Vidéo</div><a href="' + escapeHtml(v.url) + '" target="_blank" rel="noopener">' + escapeHtml(v.titre) + '</a></div>';
  });
  (c.intro && c.intro.textes || []).forEach(function(t){
    hero += '<div class="hero-link-card"><div class="cat">⚖ Texte réglementaire</div><a href="' + escapeHtml(t.url) + '" target="_blank" rel="noopener">' + escapeHtml(t.titre) + '</a></div>';
  });
  hero += '</div></div></div>';
  document.getElementById('heroHolder').innerHTML = hero;

  var contact = c.contact || {};
  var html = '<div class="page-grid">';

  // Colonne principale
  html += '<div class="main-col">';
  html += '<div class="section"><h3>📢 Actualités</h3>' + renderActualites(c.actualites) + '</div>';
  html += '<div class="section" id="sec-webinaires"><h3>🎬 Webinaires</h3>' + renderWebinaires(c.webinaires, 'sec-webinaires', 5) + '</div>';
  html += '<div class="section" id="sec-newsletters"><h3>✉️ Newsletters</h3>' + renderItemList(c.newsletters, 'sec-newsletters', 5) + '</div>';
  html += '<div class="section"><h3>📚 Ressources complémentaires</h3>' + renderRessources(c.ressources) + '</div>';
  html += '</div>';

  // Colonne laterale flottante : agenda + contact
  html += '<div class="side-col">';
  html += '<div class="agenda-card"><h3>🗓️ Agenda</h3>' + renderAgenda(c.agenda) + '</div>';
  html += '<div class="contact-card"><h3>💬 Contact &amp; assistance</h3>';
  html += '<p>' + escapeHtml(contact.texte || '') + '</p>';
  if (contact.booking_url) {
    html += '<a class="contact-cta" href="' + escapeHtml(contact.booking_url) + '" target="_blank" rel="noopener">Réservez un créneau de 15\'</a>';
  }
  if (contact.consignes_erreur || contact.email_support) {
    html += '<div class="contact-note">' + escapeHtml(contact.consignes_erreur || '') +
      (contact.email_support ? ' <a href="mailto:' + escapeHtml(contact.email_support) + '">' + escapeHtml(contact.email_support) + '</a>' : '') + '</div>';
  }
  html += '</div>';
  html += '</div>'; // /side-col

  html += '</div>'; // /page-grid

  // Footer tools (pleine largeur, sous la grille)
  var footerLiens = (c.footer_liens || []).slice();
  footerLiens.push({titre: '📊 Data emploi', url: 'https://dataemploi.francetravail.fr/'});
  html += '<div class="footer-tools"><h3>Autres outils du Réseau Pour l\'Emploi</h3><div class="footer-tools-grid">';
  footerLiens.forEach(function(l){
    html += '<a href="' + escapeHtml(l.url) + '" target="_blank" rel="noopener">' + escapeHtml(l.titre) + '</a>';
  });
  html += '</div></div>';

  var main = document.getElementById('mainContent');
  main.innerHTML = html;
  bindShowMore(main);
}

  renderPage(content);
}).catch(function(){
  renderPage(DEFAULT_CONTENT);
